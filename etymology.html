<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英単語 語源演習</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#2A2118;
  --paper:#EDE6D9;
  --paper-card:#F8F3E9;
  --deep:#1C1710;
  --a1:#8C5E3E;
  --a2:#3E7C8C;
  --correct:#3E7C8C;
  --incorrect:#A63C34;
  --line: rgba(42,33,24,0.16);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP', sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px;}
header.hero{background:var(--deep);color:var(--paper-card);padding:14px 20px 12px;border-bottom:3px solid var(--a1);}
.hero-inner{max-width:1040px;margin:0 auto;}
.back-link{color:rgba(248,243,233,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.04em;}
.eyebrow{font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--a1);margin-top:6px;margin-bottom:3px;}
h1{font-family:'Fraunces', serif;font-weight:600;font-size:clamp(19px,2.6vw,24px);margin:0 0 2px;letter-spacing:-0.01em;}
.hero p.sub{margin:0;color:rgba(248,243,233,0.72);font-size:11.5px;line-height:1.4;}
nav.chapters{display:flex;gap:6px;overflow-x:auto;padding:16px 20px 0;max-width:1040px;margin:0 auto;}
.chip{flex:0 0 auto;font-family:'IBM Plex Mono', monospace;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--a1);border-color:var(--a1);color:var(--paper-card);}
/* ---------- Two-column layout ---------- */
.layout{
  display:grid;
  grid-template-columns: 300px 1fr;
  gap:20px;
  margin-top:20px;
  align-items:start;
}
/* Left: persistent root reference panel */
.ref-panel{
  position:sticky;
  top:20px;
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:22px 20px;
}
.ref-root{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:24px;
  color:var(--a1);
  margin:0 0 2px;
}
.ref-root-ja{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:rgba(42,33,24,0.55);
  letter-spacing:0.04em;
  margin-bottom:18px;
}
.ref-hint{
  font-size:13px;
  color:rgba(42,33,24,0.55);
  margin:0;
  line-height:1.6;
}
/* Right: quiz area */
.quiz-col{min-width:0;}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-family:'IBM Plex Mono', monospace;font-size:12px;color:rgba(42,33,24,0.55);}
.progress-track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--a2);border-radius:3px;transition:width .25s;}
.card{background:var(--paper-card);border:1px solid var(--line);border-radius:4px;padding:26px 24px 22px;box-shadow:0 1px 0 rgba(42,33,24,0.04);}
.q-label{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--a2);margin-bottom:14px;}
.q-word{
  font-family:'Fraunces', serif;
  font-size:36px;
  font-weight:600;
  color:var(--ink);
  text-align:center;
  padding:18px 10px;
  margin:0 0 22px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:4px;
}
.q-text{font-family:'IBM Plex Sans JP', sans-serif;font-size:14px;color:rgba(42,33,24,0.6);margin:0 0 16px;text-align:center;}
.option{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:9px;font-family:'IBM Plex Sans JP', sans-serif;font-size:14.5px;color:var(--ink);cursor:pointer;transition:border-color .12s, background .12s;}
.option:hover:not(.locked){border-color:var(--a2);}
.option.correct{background:rgba(62,124,140,0.16);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(42,33,24,0.45);margin-right:8px;}
.explain{margin-top:16px;padding:14px 16px;border-left:3px solid var(--a1);background:rgba(140,94,62,0.08);font-size:13.5px;border-radius:0 3px 3px 0;display:none;}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--a1);}
.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{font-family:'IBM Plex Mono', monospace;font-size:12.5px;letter-spacing:0.03em;background:var(--deep);color:var(--paper-card);border:none;padding:10px 20px;border-radius:3px;cursor:pointer;display:none;}
button.next.show{display:inline-block;}
button.next:hover{background:#0f0b07;}
.result{text-align:center;padding:40px 20px;}
.result .score{font-family:'Fraunces', serif;font-size:56px;font-weight:700;color:var(--deep);}
.result .score span{font-size:22px;color:rgba(42,33,24,0.5);}
.result p{color:rgba(42,33,24,0.65);font-size:14px;}
button.retry{margin-top:14px;font-family:'IBM Plex Mono', monospace;font-size:12.5px;background:transparent;border:1px solid var(--deep);color:var(--deep);padding:9px 18px;border-radius:3px;cursor:pointer;}
footer.note{max-width:1040px;margin:36px auto 0;padding:0 20px;font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(42,33,24,0.42);line-height:1.8;}
/* ---------- Mobile: stack columns ---------- */
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
  .ref-panel{position:static;}
  .q-word{font-size:28px;}
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="index.html">← 科目選択に戻る</a>
    <div class="eyebrow">Vocabulary · Etymology Practice</div>
    <h1>英単語 語源演習</h1>
    <p class="sub">単語を見て意味を答える形式。左側にはその章の語根一覧を常時表示。18語根・108語を収録</p>
  </div>
</header>
<nav class="chapters" id="chapterNav"></nav>
<div class="wrap">
  <div class="layout">
    <div class="ref-panel" id="refPanel"></div>
    <div class="quiz-col">
      <div class="progress-row">
        <span id="progressLabel">1 / 6</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div id="quizArea"></div>
    </div>
  </div>
</div>
<footer class="note">18の頻出語根（spect, port, duct, mit, dict, struct, fer, ject, scrib, vis, cap, gen, tend, sist, cur, fac, sequ, vert）とその代表語をもとに作成。左側の語根一覧は常に表示され、参照しながら解答できる。単語・意味・解説はすべてオリジナルで作成。</footer>

<script>
const BANK = JSON.parse(document.getElementById('quiz-data').textContent);
const CHAPTER_KEYS = Object.keys(BANK);
let state = { chapter: CHAPTER_KEYS[0], idx:0, correctCount:0, answered:false, finished:false, selected:null, questions:[] };
function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  CHAPTER_KEYS.forEach(ch=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (ch===state.chapter?' active':'');
    chip.textContent = BANK[ch].label.split('＝')[0].trim();
    chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    nav.appendChild(chip);
  });
}
function renderRefPanel(){
  const panel = document.getElementById('refPanel');
  const ch = BANK[state.chapter];
  panel.innerHTML = `
    <div class="ref-root">${ch.root}</div>
    <div class="ref-root-ja">＝ ${ch.rootJa}</div>
    <p class="ref-hint">この語根を含む単語が、右側の問題に出題されます。</p>`;
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleQuestion(q){
  const order = shuffleArray(q.opts.map((_,i)=>i));
  return { word:q.word, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a), ex:q.ex };
}
function resetQuiz(){
  state.idx=0; state.correctCount=0; state.answered=false; state.finished=false; state.selected=null;
  state.questions = shuffleArray(BANK[state.chapter].questions).map(shuffleQuestion);
}
function currentQuestions(){ return state.questions; }
function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}
function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();
  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${BANK[state.chapter].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }
  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');
  area.innerHTML = `
    <div class="card">
      <div class="q-label">Q${state.idx+1} / ${qs.length}</div>
      <div class="q-word">${q.word}</div>
      <p class="q-text">この単語の意味として最も適切なものは？</p>
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}
function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}
function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){ state.finished = true; }
  else { state.idx++; state.answered=false; state.selected=null; }
  renderQuiz();
}
function render(){
  renderChapterNav();
  renderRefPanel();
  renderQuiz();
}
resetQuiz();
render();
</script>
</body>
</html>
