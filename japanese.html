<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語A 問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#241E1A;
  --paper:#EDE4D3;
  --paper-card:#F9F2E4;
  --deep:#231A14;
  --vocab:#5E6B4F;
  --char:#9A5B3C;
  --exam:#3E5B6B;
  --correct:#5E6B4F;
  --incorrect:#A63C34;
  --line: rgba(36,30,26,0.16);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans JP', sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

/* ---------- Hero ---------- */
header.hero{
  background:var(--deep);
  color:var(--paper-card);
  padding:44px 20px 30px;
  border-bottom:6px solid var(--char);
}
.hero-inner{max-width:760px;margin:0 auto;}
.back-link{color:rgba(249,242,228,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--char);
  margin-top:14px;
  margin-bottom:10px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.hero p.sub{margin:0;color:rgba(249,242,228,0.72);font-size:14.5px;}

/* Signature — three-part index strip echoing the three quiz categories */
.strip{
  margin-top:22px;
  display:flex;
  height:10px;
  border-radius:6px;
  overflow:hidden;
}
.strip div{flex:1;}
.strip .s1{background:var(--vocab);}
.strip .s2{background:var(--char);}
.strip .s3{background:var(--exam);}
.strip-labels{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.04em;
  margin-top:6px;
  color:rgba(249,242,228,0.6);
}

/* ---------- Type tabs ---------- */
.type-tabs{
  display:flex;
  margin:24px auto 4px;
  max-width:760px;
  padding:0 20px;
  border-bottom:2px solid var(--line);
}
.type-tab{
  flex:1;
  text-align:center;
  padding:12px 6px;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:15px;
  color:rgba(36,30,26,0.45);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;
  transition:color .15s;
}
.type-tab .count{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-weight:400;
  font-size:10.5px;
  margin-top:2px;
  letter-spacing:0.04em;
}
.type-tab.active{color:var(--ink);}
.type-tab[data-t="vocab"].active{border-bottom-color:var(--vocab);}
.type-tab[data-t="char"].active{border-bottom-color:var(--char);}
.type-tab[data-t="exam"].active{border-bottom-color:var(--exam);}

/* ---------- Progress ---------- */
.progress-row{
  display:flex;align-items:center;gap:10px;
  margin:18px 0 6px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:rgba(36,30,26,0.55);
}
.progress-track{
  flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;
}
.progress-fill{height:100%;border-radius:3px;transition:width .25s;}

/* ---------- Card ---------- */
.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:26px 24px 22px;
  margin-top:14px;
  box-shadow:0 1px 0 rgba(36,30,26,0.04);
}
.q-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:10px;
}
.q-text{
  font-family:'Fraunces', serif;
  font-size:18.5px;
  font-weight:500;
  line-height:1.6;
  margin:0 0 20px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:9px;
  font-family:'IBM Plex Sans JP', sans-serif;
  font-size:14.5px;
  color:var(--ink);
  cursor:pointer;
  transition:border-color .12s, background .12s;
}
.option:hover:not(.locked){border-color:var(--char);}
.option.correct{background:rgba(94,107,79,0.18);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(36,30,26,0.45);
  margin-right:8px;
}

.explain{
  margin-top:16px;
  padding:14px 16px;
  border-left:3px solid var(--char);
  background:rgba(154,91,60,0.08);
  font-size:13.5px;
  border-radius:0 3px 3px 0;
  display:none;
}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--char);}

.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  letter-spacing:0.03em;
  background:var(--deep);
  color:var(--paper-card);
  border:none;
  padding:10px 20px;
  border-radius:3px;
  cursor:pointer;
  display:none;
}
button.next.show{display:inline-block;}
button.next:hover{background:#150f0b;}

/* ---------- Result ---------- */
.result{
  text-align:center;
  padding:40px 20px;
}
.result .score{
  font-family:'Fraunces', serif;
  font-size:56px;
  font-weight:700;
  color:var(--deep);
}
.result .score span{font-size:22px;color:rgba(36,30,26,0.5);}
.result p{color:rgba(36,30,26,0.65);font-size:14px;}
button.retry{
  margin-top:14px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  background:transparent;
  border:1px solid var(--deep);
  color:var(--deep);
  padding:9px 18px;
  border-radius:3px;
  cursor:pointer;
}

footer.note{
  max-width:760px;margin:36px auto 0;padding:0 20px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(36,30,26,0.42);
  line-height:1.8;
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="index.html">← 科目選択に戻る</a>
    <div class="eyebrow">IBDP · Language A: Japanese · Language &amp; Literature · HL</div>
    <h1>日本語A 問題集</h1>
    <p class="sub">用語（技法・概念・指示用語）/ キャラクター / テスト形式 — 3カテゴリの演習アプリ</p>
    <div class="strip"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>
    <div class="strip-labels"><span>用語</span><span>キャラクター</span><span>テスト形式</span></div>
  </div>
</header>

<div class="type-tabs" id="typeTabs"></div>
<div class="wrap">
  <div class="progress-row">
    <span id="progressLabel">1 / 9</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
</div>

<footer class="note">用語・キャラクターは授業ノートに基づく。テスト形式はIB Language A: Language and Literature（HL, First assessment 2026）の公式シラバス・評価基準を複数の情報源で確認して作成。</footer>

ividual Oralについて、暗記に関する推奨事項として正しいものは？","opts":["序論で問題の整理・論の指針・5W1H、本論で両作品の比較と対比、結論で全体の整理・まとめ","発表を丸暗記することは推奨されておらず、聞き手との自然な対話性を損なうとされる","4つの一般的な問いから1つを選び、履修した2つの文学作品を用いて比較小論文を書く","履修した文学作品からの抜粋1つと、非文学的なテキスト（またはその抜粋）1つを、グローバルイシューという観点で結びつけて分析する"],"a":1,"ex":"暗記は聞き手との対話性を損なうとされる。"},{"q":"「比較小論文」で扱いうるテーマの例として、坊っちゃん・桜の園・日の名残り・ゴリオ爺さんに共通してノートに挙げられているものは？","opts":["愛情、階級（没落・台頭）、執着、広い意味での対立、出世や財産","2400〜3000字で、疑問文形式の探求の道筋を立て、作品体系を意識したやや抽象的なテーマが適切とされる、HLのみに課される課題","B2（比較・対比）：2つの文学作品間の類似点と相違点を評価する項目","40点満点で採点され、HLの最終評価全体の20%を占める"],"a":0,"ex":"複数作品を貫くテーマ群。"}]};
const TYPE_META = {
  vocab:{label:"用語", tag:"VOCAB", color:"var(--vocab)"},
  char:{label:"キャラクター", tag:"CHARACTER", color:"var(--char)"},
  exam:{label:"テスト形式", tag:"EXAM", color:"var(--exam)"}
};

let state = { type:"vocab", idx:0, correctCount:0, answered:false, finished:false };

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    tab.setAttribute('data-t', t);
    const n = QUESTION_BANK[t].length;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}

function resetQuiz(){
  state.idx = 0; state.correctCount = 0; state.answered = false; state.finished = false;
}

function currentQuestions(){
  return QUESTION_BANK[state.type];
}

function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  const fill = document.getElementById('progressFill');
  fill.style.width = pct+'%';
  fill.style.background = TYPE_META[state.type].color;
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();

  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }

  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <div class="q-label" style="color:${TYPE_META[state.type].color}">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}

function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}

function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){
    state.finished = true;
  } else {
    state.idx++;
    state.answered = false;
    state.selected = null;
  }
  renderQuiz();
}

function render(){
  renderTypeTabs();
  renderQuiz();
}

render();
</script>
