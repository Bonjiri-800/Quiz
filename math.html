<!DOCTYPE html>
<html lang="ja">
<head>

<title>数学 AA 公式問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#1E1A2E;
  --paper:#EAE6F0;
  --paper-card:#F7F5FA;
  --deep:#171226;
  --a1:#5B4E8C;
  --a2:#3E8C7A;
  --correct:#3E8C7A;
  --incorrect:#A63C34;
  --line: rgba(30,26,46,0.16);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP', sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}
header.hero{background:var(--deep);color:var(--paper-card);padding:14px 20px 12px;border-bottom:3px solid var(--a2);}
.hero-inner{max-width:760px;margin:0 auto;}
.back-link{color:rgba(247,245,250,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.04em;}
.eyebrow{font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--a2);margin-top:6px;margin-bottom:3px;}
h1{font-family:'Fraunces', serif;font-weight:600;font-size:clamp(19px,2.6vw,24px);margin:0 0 2px;letter-spacing:-0.01em;}
.hero p.sub{margin:0;color:rgba(247,245,250,0.72);font-size:11.5px;line-height:1.4;}
.spectrum{margin-top:8px;height:6px;border-radius:4px;background:linear-gradient(90deg, var(--a1) 0%, var(--a1) 20%, #7A6BA8 40%, #5C9C8C 60%, var(--a2) 80%, var(--a2) 100%);}
.spectrum-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono', monospace;font-size:9px;letter-spacing:0.03em;margin-top:3px;color:rgba(247,245,250,0.6);text-transform:uppercase;}
nav.chapters{display:flex;gap:6px;overflow-x:auto;padding:16px 20px 0;max-width:760px;margin:0 auto;}
.chip{flex:0 0 auto;font-family:'IBM Plex Mono', monospace;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--a1);border-color:var(--a1);color:var(--paper-card);}
.type-tabs{display:flex;margin:26px 0 4px;border-bottom:2px solid var(--line);}
.type-tab{flex:1;text-align:center;padding:12px 6px;font-family:'Fraunces', serif;font-weight:600;font-size:15px;color:rgba(30,26,46,0.45);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.type-tab .count{display:block;font-family:'IBM Plex Mono', monospace;font-weight:400;font-size:10.5px;margin-top:2px;letter-spacing:0.04em;}
.type-tab.active{color:var(--ink);border-bottom-color:var(--a2);}
.progress-row{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-family:'IBM Plex Mono', monospace;font-size:12px;color:rgba(30,26,46,0.55);}
.progress-track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--a2);border-radius:3px;transition:width .25s;}
.card{background:var(--paper-card);border:1px solid var(--line);border-radius:4px;padding:26px 24px 22px;margin-top:14px;box-shadow:0 1px 0 rgba(30,26,46,0.04);}
.q-label{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--a2);margin-bottom:10px;}
.q-text{font-family:'Fraunces', serif;font-size:18.5px;font-weight:500;line-height:1.6;margin:0 0 20px;}
.formula-display{font-family:'IBM Plex Mono', monospace;font-size:16.5px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:-8px 0 18px;text-align:center;letter-spacing:0.01em;word-break:break-word;}
.option{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:9px;font-family:'IBM Plex Sans JP', sans-serif;font-size:14.5px;color:var(--ink);cursor:pointer;transition:border-color .12s, background .12s;}
.option:hover:not(.locked){border-color:var(--a2);}
.option.correct{background:rgba(62,140,122,0.16);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(30,26,46,0.45);margin-right:8px;}
.explain{margin-top:16px;padding:14px 16px;border-left:3px solid var(--a1);background:rgba(91,78,140,0.08);font-size:13.5px;border-radius:0 3px 3px 0;display:none;}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--a1);}
.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{font-family:'IBM Plex Mono', monospace;font-size:12.5px;letter-spacing:0.03em;background:var(--deep);color:var(--paper-card);border:none;padding:10px 20px;border-radius:3px;cursor:pointer;display:none;}
button.next.show{display:inline-block;}
button.next:hover{background:#0e0a18;}
.result{text-align:center;padding:40px 20px;}
.result .score{font-family:'Fraunces', serif;font-size:56px;font-weight:700;color:var(--deep);}
.result .score span{font-size:22px;color:rgba(30,26,46,0.5);}
.result p{color:rgba(30,26,46,0.65);font-size:14px;}
button.retry{margin-top:14px;font-family:'IBM Plex Mono', monospace;font-size:12.5px;background:transparent;border:1px solid var(--deep);color:var(--deep);padding:9px 18px;border-radius:3px;cursor:pointer;}
footer.note{max-width:760px;margin:36px auto 0;padding:0 20px;font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(30,26,46,0.42);line-height:1.8;}
</style>

la": "", "q": "初項3、公差5の等差数列の第10項を求めたい。どの公式を使うべきか？", "opts": ["uₙ = u₁ + (n-1)d", "Sₙ = n/2(2u₁+(n-1)d)", "uₙ = u₁rⁿ⁻¹", "S∞ = u₁/(1-r)"], "a": 0, "ex": "求めたいのは「第10項」という1つの項の値なので、和の公式ではなく等差数列の一般項の公式を使う。"}, {"formula": "", "q": "初項3、公差5の等差数列の最初の10項の和を求めたい。どの公式を使うべきか？", "opts": ["uₙ = u₁ + (n-1)d", "Sₙ = n/2(2u₁+(n-1)d)", "Sₙ = u₁(rⁿ-1)/(r-1)", "nCr = n!/(r!(n-r)!)"], "a": 1, "ex": "「和」を求める設問。等比数列の和の公式（公比rを使う形）ではなく、公差dを使う等差数列の和の公式を選ぶ。"}, {"formula": "", "q": "初項2、公比3の等比数列の第6項を求めたい。どの公式を使うべきか？", "opts": ["uₙ = u₁rⁿ⁻¹", "Sₙ = u₁(rⁿ-1)/(r-1)", "S∞ = u₁/(1-r)", "uₙ = u₁ + (n-1)d"], "a": 0, "ex": "「第6項」という1つの項なので一般項の公式を使う。なお公比r=3は|r|≥1なので、そもそもS∞は使用できない。"}, {"formula": "", "q": "初項2、公比3の等比数列の最初の6項の和を求めたい。どの公式を使うべきか？", "opts": ["S∞ = u₁/(1-r)", "Sₙ = u₁(rⁿ-1)/(r-1)", "uₙ = u₁rⁿ⁻¹", "Sₙ = n/2(2u₁+(n-1)d)"], "a": 1, "ex": "項数が6と有限なのでSₙ（有限和）を使う。公比r=3は|r|<1を満たさないため、S∞（無限和）は本来使用できない点に注意。"}, {"formula": "", "q": "初項4、公比0.5の無限に続く等比数列の総和を求めたい。どの公式を使うべきか？", "opts": ["Sₙ = u₁(rⁿ-1)/(r-1)", "uₙ = u₁rⁿ⁻¹", "S∞ = u₁/(1-r)", "Sₙ = n/2(2u₁+(n-1)d)"], "a": 2, "ex": "「無限に続く」和で、|r|=0.5<1を満たすのでS∞が使える。有限和の公式（項数nが必要）は使えない。"}, {"formula": "", "q": "8人の中から3人を選んで委員会を作りたい（選ぶ順序は関係ない）。何通りの選び方があるか求めるには、どの公式を使うべきか？", "opts": ["8! （8人全員を1列に並べる場合の数）", "nCr = n!/(r!(n-r)!)", "(a+b)ⁿ = ΣnCr aⁿ⁻ʳbʳ", "uₙ = u₁rⁿ⁻¹"], "a": 1, "ex": "順序を区別しない「選び方」なので組合せnCrを使う。順序を区別する場合（並び方）とは異なる式になる。"}, {"formula": "", "q": "(2x+1)⁵の展開式におけるx³の項の係数を求めたい。どの公式を使うべきか？", "opts": ["nCr = n!/(r!(n-r)!)のみ", "(a+b)ⁿ = ΣnCr aⁿ⁻ʳbʳ（二項定理）", "Sₙ = u₁(rⁿ-1)/(r-1)", "uₙ = u₁ + (n-1)d"], "a": 1, "ex": "nCrだけでは係数の数値は出せても文字式の展開項は求まらない。展開全体を扱う二項定理を使う必要がある。"}, {"formula": "", "q": "複素数z=1+iを極形式（絶対値と偏角）で表したい。どの公式を使うべきか？", "opts": ["z = r(cosθ+isinθ) = re^(iθ)", "|z| = √(a²+b²)（絶対値のみ）", "z̄ = a-bi（共役複素数）", "z₁z₂ = r₁r₂(cos(θ₁+θ₂)+isin(θ₁+θ₂))"], "a": 0, "ex": "「極形式で表す」ことが目的なので絶対値と偏角の両方を含む極形式の公式を使う。絶対値だけの式や共役の式では極形式にならない。"}]}, "2": {"label": "2. 関数（Functions）", "meaning": [{"formula": "m = (y₂-y₁)/(x₂-x₁)", "q": "この公式の意味として正しいものは？", "opts": ["2点の座標から直線の傾きmを求める式", "2点の座標から、その中点の座標を求める式", "2点間の距離を求める式", "直線の方程式を傾きと切片から表す式"], "a": 0, "ex": "「傾き」を求める式。中点の公式（(x₁+x₂)/2, (y₁+y₂)/2）や距離の公式（三平方の定理）と混同しないこと。"}, {"formula": "f(x)=ax²+bx+c", "q": "この公式の意味として正しいものは？", "opts": ["二次関数の一般形で、対称軸はx=-b/2aとなる", "二次関数の頂点の座標を(p,q)として直接表す平方完成形", "二次方程式ax²+bx+c=0の解を求める公式", "二次方程式が実数解を持つかを判定する判別式"], "a": 0, "ex": "係数a,b,cで表した「一般形」。頂点が直接見える「平方完成形」a(x-p)²+qとは形が異なる。"}, {"formula": "Δ = b²-4ac", "q": "この公式の意味として正しいものは？", "opts": ["二次方程式ax²+bx+c=0の実数解の個数（判別式の符号）を判定するための式", "二次方程式ax²+bx+c=0の実際の解の値を直接求める式", "2点の座標から直線の傾きを求める式", "二次関数の対称軸のx座標を求める式"], "a": 0, "ex": "判別式Δは解の「個数・種類」を判定するだけで、解そのものの値（x=...）は求まらない点に注意。"}, {"formula": "x = (-b±√(b²-4ac))/2a", "q": "この公式の意味として正しいものは？", "opts": ["二次方程式ax²+bx+c=0の解xを、係数a,b,cから求める解の公式", "二次方程式が実数解を持つかどうかだけを判定する式", "二次関数の対称軸を求める式", "2点の座標から直線の傾きを求める式"], "a": 0, "ex": "実際の解の値を求める式。実数解の有無だけを判定する判別式（Δ）とは役割が異なる。"}, {"formula": "y = mx+c", "q": "この公式の意味として正しいものは？", "opts": ["傾きmとy切片cを用いて直線の方程式を表す式", "傾きmと直線上の1点(x₁,y₁)を用いて直線の方程式を表す式", "2点の座標から直線の傾きを求める式", "二次関数の対称軸を求める式"], "a": 0, "ex": "「y切片c」を用いる形（スロープ・インターセプト形）。1点の座標を使う形（y-y₁=m(x-x₁)）とは使う情報が異なる。"}, {"formula": "剰余の定理", "q": "剰余の定理の説明として正しいものは？", "opts": ["多項式P(x)を(x-a)で割った余りは、P(a)の値に等しい", "P(a)=0であれば、(x-a)はP(x)の因数である", "多項式P(x)を(x-a)で割った商は、P(a)の値に等しい", "P(x)の次数が分かれば、解の個数が分かる"], "a": 0, "ex": "剰余の定理は「余り」がP(a)に等しいという定理。「P(a)=0なら因数」は別の定理（因数定理）の内容。"}, {"formula": "因数定理", "q": "因数定理の説明として正しいものは？", "opts": ["P(a)=0であるとき、かつそのときに限り、(x-a)はP(x)の因数である", "多項式P(x)を(x-a)で割った余りは、常にP(a)の値に等しい", "多項式P(x)の係数の和は、P(1)の値に等しい", "二次方程式の解の公式そのものを表す定理"], "a": 0, "ex": "因数定理は「P(a)=0 ⟺ (x-a)が因数」という定理。「余り＝P(a)」自体は剰余の定理の内容であり、余りが0の特別な場合が因数定理にあたる。"}, {"formula": "f(x)=(ax+b)/(cx+d)", "q": "この形の有理関数の漸近線に関する説明として正しいものは？", "opts": ["垂直漸近線は分母cx+d=0となるxの値、水平漸近線はy=a/c（分子・分母の最高次係数の比）", "垂直漸近線はy=a/c、水平漸近線は分母cx+d=0となるxの値", "垂直漸近線も水平漸近線も、分子ax+b=0から求める", "垂直漸近線・水平漸近線ともに、a,b,c,dの値によらず存在しない"], "a": 0, "ex": "垂直漸近線は分母が0になるところ（定義域の外）、水平漸近線はxを無限大にしたときの極限（最高次の係数比）。この2つの役割を逆にしないこと。"}], "application": [{"formula": "", "q": "2点(1,2)と(4,8)を通る直線の傾きを求めたい。どの公式を使うべきか？", "opts": ["x = (-b±√(b²-4ac))/2a", "Δ = b²-4ac", "m = (y₂-y₁)/(x₂-x₁)", "y = mx+c"], "a": 2, "ex": "「傾き」を求める設問なので、2点から傾きを求める公式を使う。y=mx+cは傾きが分かった後に式を作る段階で使う式。"}, {"formula": "", "q": "二次関数f(x)=2x²-4x+1の対称軸のx座標を求めたい。どの公式を使うべきか？", "opts": ["Δ = b²-4ac", "x = (-b±√(b²-4ac))/2a", "m = (y₂-y₁)/(x₂-x₁)", "f(x)=ax²+bx+c（軸x=-b/2a）"], "a": 3, "ex": "対称軸を求める設問。解の公式（x=…）は方程式=0の解を求めるためのもので、対称軸を直接求める式ではない。"}, {"formula": "", "q": "二次方程式x²+3x+5=0が実数解を持つかどうかを調べたい（解自体は求めなくてよい）。どの公式を使うべきか？", "opts": ["x = (-b±√(b²-4ac))/2a", "Δ = b²-4ac", "f(x)=ax²+bx+c", "m = (y₂-y₁)/(x₂-x₁)"], "a": 1, "ex": "「実数解を持つか」を調べるだけなら判別式で十分。解の公式まで使うと計算量が増え、平方根の中が負なら結局実数解なしと分かる遠回りになる。"}, {"formula": "", "q": "二次方程式2x²-3x-2=0の解を求めたい。どの公式を使うべきか？", "opts": ["x = (-b±√(b²-4ac))/2a", "Δ = b²-4ac", "y = mx+c", "f(x)=ax²+bx+c"], "a": 0, "ex": "解の「値」を求める設問なので、判別式ではなく解の公式を使う。"}, {"formula": "", "q": "多項式P(x)=x³-2x²-5x+6を(x-1)で割った余りを、割り算を実行せずに求めたい。どの公式・定理を使うべきか？", "opts": ["因数定理を使い、P(1)=0かどうかだけを確認する", "剰余の定理を使い、P(1)の値をそのまま余りとする", "解の公式を使い、方程式P(x)=0を解く", "判別式Δを使う"], "a": 1, "ex": "「余り」を求める設問には剰余の定理（余り＝P(a)）を使う。因数定理はP(a)=0かどうか（＝余りが0か）を判定するためのもの。"}, {"formula": "", "q": "多項式P(x)=x³-7x+6が(x-1)を因数に持つかどうかを確かめたい。どの公式・定理を使うべきか？", "opts": ["因数定理を使い、P(1)=0となるか確認する", "剰余の定理を使い、P(1)の値を商として求める", "判別式Δ=b²-4acを使う", "m = (y₂-y₁)/(x₂-x₁)を使う"], "a": 0, "ex": "「因数かどうか」を確かめるのは因数定理の役割。P(1)を計算しゼロになれば(x-1)は因数と分かる。"}, {"formula": "", "q": "傾き3、y切片が-2である直線の方程式を求めたい。どの公式を使うべきか？", "opts": ["y = mx+c", "Δ = b²-4ac", "x = (-b±√(b²-4ac))/2a", "m = (y₂-y₁)/(x₂-x₁)"], "a": 0, "ex": "傾きとy切片が両方与えられているので、直接y=mx+cに代入すればよい（2点の座標は与えられていないので傾きの公式は使わない）。"}, {"formula": "", "q": "有理関数f(x)=(2x+1)/(x-3)の垂直漸近線の位置を求めたい。どの公式を使うべきか？", "opts": ["分母x-3=0となるxの値を求める", "分子2x+1=0となるxの値を求める", "分子と分母の最高次の係数の比を求める（水平漸近線の求め方）", "判別式Δ=b²-4acを使う"], "a": 0, "ex": "垂直漸近線は分母が0になる（定義域から除外される）xの値。分子を0にする操作はx切片（グラフがx軸と交わる点）を求める操作であり別物。"}]}, "3": {"label": "3. 幾何とベクトル（Geometry and trigonometry）", "meaning": [{"formula": "|v| = √(v₁²+v₂²+v₃²)", "q": "この公式の意味として正しいものは？", "opts": ["ベクトルvの大きさ（長さ）を成分から求める式", "2つのベクトルの内積（スカラー積）を成分から求める式", "2つのベクトルの外積（ベクトル積）の大きさを求める式", "ベクトルvを単位ベクトルに変換する式"], "a": 0, "ex": "1つのベクトルの「大きさ」を求める式。2つのベクトルの間の計算（内積・外積）とは引数の数が異なる点に注意。"}, {"formula": "v·w = |v||w|cosθ", "q": "この公式の意味として正しいものは？", "opts": ["2つのベクトルv, wのなす角θを用いてスカラー積（内積）を表す式", "2つのベクトルv, wが作る平行四辺形の面積を表す式", "ベクトルvの大きさを成分から求める式", "2つのベクトルの和v+wの大きさを求める式"], "a": 0, "ex": "内積（スカラー積）の定義。結果はスカラー（数値）であり、面積（外積の大きさ）と混同しないこと。"}, {"formula": "|v×w| = |v||w|sinθ", "q": "この公式の意味として正しいものは？", "opts": ["2つのベクトルv, wが作る平行四辺形の面積を、なす角θを用いて表すベクトル積の大きさ", "2つのベクトルv, wのなす角θを用いてスカラー積を表す式", "ベクトルの大きさを成分から求める式", "2つのベクトルが垂直であるかどうかを判定する式（内積が0になるかを見る式）"], "a": 0, "ex": "外積（ベクトル積）の大きさで、cosθではなくsinθを使う点、結果が面積に対応する点が内積との違い。"}, {"formula": "r = a + λb", "q": "この公式の意味として正しいものは？", "opts": ["ある点aを通り、方向ベクトルbに平行な直線をベクトル形式で表す式", "法線ベクトルbと平面上の1点aを用いて平面の方程式を表す式", "2点a, bの中点の位置ベクトルを求める式", "2つのベクトルa, bの内積を表す式"], "a": 0, "ex": "「直線」のベクトル方程式。似た形の「平面」の方程式（法線ベクトルを使うr·n=a·n）と混同しやすいので注意。"}, {"formula": "r·n = a·n", "q": "この公式の意味として正しいものは？", "opts": ["法線ベクトルnと平面上の1点aを用いて平面の方程式を表す式", "ある点aを通り、方向ベクトルnに平行な直線をベクトル形式で表す式", "2つのベクトルが作る平行四辺形の面積を求める式", "ベクトルnの大きさを求める式"], "a": 0, "ex": "「平面」の方程式（法線ベクトル形）。方向ベクトルを使う「直線」の方程式r=a+λbとは、使うベクトルの意味（法線か方向か）が異なる。"}, {"formula": "cosθ = (v·w)/(|v||w|)", "q": "この公式の意味として正しいものは？", "opts": ["内積の定義式を変形して、2つのベクトルのなす角θを求める式", "外積の定義式を変形して、2つのベクトルのなす角θを求める式", "2つのベクトルが垂直であるための条件式そのもの", "2つのベクトルの和の大きさを求める式"], "a": 0, "ex": "v·w=|v||w|cosθを角θについて解いた式。垂直条件（v·w=0）はこの式の特別な場合（θ=90°）にすぎない。"}, {"formula": "平面と直線のなす角", "q": "直線の方向ベクトルbと平面の法線ベクトルnを用いて、直線と平面のなす角θを求める考え方として正しいものは？", "opts": ["bとnのなす角φをcosφ=(b·n)/(|b||n|)で求め、θ=90°-φとする", "bとnのなす角θをそのままcosθ=(b·n)/(|b||n|)として答えとする", "bとnの外積の大きさをそのまま角度θとする", "bとnが垂直であれば、直線は平面と平行である"], "a": 0, "ex": "方向ベクトルと法線ベクトルのなす角φは、直線と平面のなす角θとは90°分ズレる（θ=90°-φ）点が典型的な誤りポイント。なお選択肢4は逆（bとnが垂直→直線は平面に平行）で正しい関係だが、この設問の「なす角の求め方」の説明としては誤り。"}, {"formula": "点と平面の距離", "q": "点Pと平面（法線ベクトルn、平面上の点A）との距離を求める考え方として正しいものは？", "opts": ∩B)=0であるかどうかを確認する（排反条件と混同）", "P(A|B)=P(B|A)が成り立つかどうかを確認する", "P(A∪B)=P(A)+P(B)が成り立つかどうかを確認する（排反条件と混同）"], "a": 0, "ex": "独立性の定義は乗法。「排反（互いに同時に起こらない）」と「独立」はしばしば混同されるが全くの別概念で、排反な事象同士は基本的に独立ではない。"}, {"formula": "標本平均の分布", "q": "母集団が平均μ、標準偏差σを持つとき、大きさnの標本平均X̄の分布に関する説明として正しいものは？", "opts": ["X̄の期待値はμ、標準偏差はσ/√n（標本が大きいほど、標本平均のばらつきは小さくなる）", "X̄の期待値はμ/n、標準偏差はσ", "X̄の期待値はμ、標準偏差はσ（標本の大きさによらず母集団と同じ）", "X̄の期待値も標準偏差も、nが大きくなるほど大きくなる"], "a": 0, "ex": "標本平均の標準偏差（標準誤差）はσ/√nとなり、標本サイズnが大きいほど小さくなる（ばらつきが減る）。これを母集団の標準偏差とそのまま同じだと誤解しやすい。"}], "application": [{"formula": "", "q": "事象AまたはBのどちらかが起こる確率を、それぞれの確率と両方が同時に起こる確率から求めたい。どの公式を使うべきか？", "opts": ["E(X) = Σxᵢ P(X=xᵢ)", "P(A∪B) = P(A)+P(B)-P(A∩B)", "z = (x-μ)/σ", "P(A|B) = P(A∩B)/P(B)"], "a": 1, "ex": "「AまたはB」という和事象の確率なので一般加法定理を使う。条件付き確率の式ではAとBの「片方が起きた前提」の話になり設問と噛み合わない。"}, {"formula": "", "q": "事象Bが起こったという条件のもとで、事象Aが起こる確率を求めたい。どの公式を使うべきか？", "opts": ["P(A∩B) = P(A)×P(B)（AとBが独立であるという前提の式）", "P(A∪B) = P(A)+P(B)-P(A∩B)", "Var(X) = E(X²)-[E(X)]²", "P(A|B) = P(A∩B)/P(B)"], "a": 3, "ex": "「Bが起きたという条件のもとでのA」という表現は条件付き確率を意味する。AとBが独立とは限らないため、独立を前提とする乗法定理をそのまま使うのは誤り。"}, {"formula": "", "q": "サイコロを1回振ったときの出た目の期待値を求めたい。どの公式を使うべきか？", "opts": ["z = (x-μ)/σ", "P(A|B) = P(A∩B)/P(B)", "E(X) = Σxᵢ P(X=xᵢ)", "Var(X) = E(X²)-[E(X)]²"], "a": 2, "ex": "「期待値」を求める設問。分散の公式ではなく期待値の公式をそのまま使う。"}, {"formula": "", "q": "ある確率変数Xの分散を、期待値E(X)とE(X²)から求めたい。どの公式を使うべきか？", "opts": ["P(A∪B) = P(A)+P(B)-P(A∩B)", "z = (x-μ)/σ", "Var(X) = E(X²)-[E(X)]²", "E(X) = Σxᵢ P(X=xᵢ)"], "a": 2, "ex": "「分散」を求める設問なので分散の公式を使う。E(X)の公式だけでは分散は求まらない。"}, {"formula": "", "q": "平均μ、標準偏差σの正規分布に従うデータのある値xを、標準正規分布のz値に変換したい。どの公式を使うべきか？", "opts": ["Var(X) = E(X²)-[E(X)]²", "z = (x-μ)/σ", "E(X) = Σxᵢ P(X=xᵢ)", "P(A|B) = P(A∩B)/P(B)"], "a": 1, "ex": "標準化（z変換）を行いたい設問。分散の公式や期待値の公式ではz値は求まらない。"}, {"formula": "", "q": "生徒10人が独立にテストに合格するかどうかを調べ、合格確率pが全員共通のとき、合格者数Xの期待値と分散を求めたい。どの公式を使うべきか？", "opts": ["E(X)=np, Var(X)=np(1-p)（二項分布）", "E(X)=λ, Var(X)=λ（ポアソン分布）", "z = (x-μ)/σ（標準化）", "P(A|B) = P(A∩B)/P(B)（条件付き確率）"], "a": 0, "ex": "「独立な試行をn回、各回の成功確率pが一定」という条件は二項分布の典型的な設定。ポアソン分布は「単位時間・単位面積あたりの発生回数」を扱う場面で使うため、この設問には合わない。"}, {"formula": "", "q": "2つの事象A, Bについて、実際にP(A∩B)=P(A)×P(B)が成り立つかどうかを計算で確認したい。何を確認しているか？", "opts": ["AとBが独立であるかどうか", "AとBが排反であるかどうか", "AとBのどちらかが必ず起こるかどうか", "AとBが同一の事象であるかどうか"], "a": 0, "ex": "この等式は独立性の定義そのもの。排反性（同時に起こらないこと）とは別の概念であり、P(A∩B)=0であるかどうかとは異なる確認をしている。"}, {"formula": "", "q": "母集団の標準偏差がσ=8、標本の大きさがn=16のとき、標本平均の標準偏差（標準誤差）を求めたい。どの考え方を使うべきか？", "opts": ["σ/√n = 8/√16 = 2 を計算する", "σ×√n = 8×√16 = 32 を計算する", "σをそのまま使う（8のまま）", "σ/n = 8/16 = 0.5 を計算する"], "a": 0, "ex": "標本平均の標準偏差はσ/√nで求める。√nで割ることを忘れて母集団の標準偏差をそのまま使う、あるいはnで直接割ってしまう、という2種類の間違いが典型的。"}]}, "5": {"label": "5. 微分積分（Calculus）", "meaning": [{"formula": "f'(x)=nxⁿ⁻¹  （f(x)=xⁿ）", "q": "この公式の意味として正しいものは？", "opts": ["べき関数f(x)=xⁿの導関数を求める式", "べき関数f(x)=xⁿの不定積分を求める式", "2つの関数の積を微分する積の法則", "三角関数sinxの導関数を求める式"], "a": 0, "ex": "微分の公式。似た形の積分公式（指数が+1され、n+1で割る）と操作が逆になっている点に注意。"}, {"formula": "d/dx(uv) = u·dv/dx + v·du/dx", "q": "この公式の意味として正しいものは？", "opts": ["2つの関数u, vの積として表される関数を微分する積の法則", "2つの関数u, vの商として表される関数を微分する商の法則", "合成関数を微分する連鎖律", "部分積分の公式"], "a": 0, "ex": "「積」の微分法則。「商」の微分法則（(u/v)'=(u'v-uv')/v²、分母がv²で割り算・引き算になる点が異なる）と混同しやすい。"}, {"formula": "d/dx(sin x) = cos x", "q": "この公式の意味として正しいものは？", "opts": ["関数f(x)=sin xの導関数がcos xであることを示す式", "関数f(x)=cos xの導関数がsin xであることを示す式", "関数f(x)=sin xの不定積分がcos xであることを示す式", "関数f(x)=sin xの導関数が-cos xであることを示す式"], "a": 0, "ex": "sinxの導関数はcosx（符号はプラス）。cosxの導関数は-sinx（符号がマイナスになる）であり、こちらと混同しやすい。"}, {"formula": "∫xⁿ dx = xⁿ⁺¹/(n+1) + C", "q": "この公式の意味として正しいものは？", "opts": ["べき関数xⁿの不定積分を求める式", "べき関数xⁿの導関数を求める式", "べき関数xⁿの定積分の値を、積分区間を代入せずに求める式", "2つの関数の積の導関数を求める積の法則"], "a": 0, "ex": "不定積分の公式。指数がn+1に「増える」点が、指数がn-1に「減る」微分の公式と逆になっている。"}, {"formula": "∫u·dv/dx dx = uv - ∫v·du/dx dx", "q": "この公式の意味として正しいものは？", "opts": ["2つの関数の積として表される関数を積分するための部分積分の公式", "2つの関数の積として表される関数を微分するための積の法則", "合成関数を積分するための置換積分の公式", "三角関数の導関数を求める式"], "a": 0, "ex": "部分積分の公式。似た場面（積の形）で使う「積の微分法則」とは、微分と積分という逆の操作である点に注意。"}, {"formula": "連鎖律 d/dx f(g(x)) = f'(g(x))・g'(x)", "q": "この公式の意味として正しいものは？", "opts": ["合成関数f(g(x))を微分するための連鎖律（チェーンルール）", "2つの関数の積として表される関数を微分する積の法則", "2つの関数の商として表される関数を微分する商の法則", "逆関数を微分するための公式"], "a": 0, "ex": "「関数の中に関数がある」合成関数の微分法則。「2つの別々の関数の掛け算」を微分する積の法則とは適用場面が異なる。"}, {"formula": "定積分の意味", "q": "定積分∫ₐᵇ f(x) dxの意味として正しいものは？", "opts": ["x=aからx=bまでの範囲で、f(x)のグラフとx軸の間の符号付き面積を表す", "f(x)の導関数f'(x)の、x=aからx=bまでの平均値を表す", "不定積分の結果として得られる、積分定数Cを含む関数全体を表す", "f(x)のx=aにおける接線の傾きを表す"], "a": 0, "ex": "定積分は数値（面積に対応する値）が求まる。積分定数Cを含む関数の形が残るのは不定積分の方であり、混同しやすい。"}, {"formula": "陰関数微分", "q": "x²+y²=25のように、yがxの陽関数の形で表されていない式を微分する「陰関数微分」の考え方として正しいものは？", "opts": ["両辺をxで微分し、yを含む項にはdy/dxを掛けて、その後dy/dxについて解く", "式をまずy=…の形に変形してから、通常通りxで微分する（陰関数のままでは微分できない）", "xについての項だけを微分し、yについての項はすべて定数として扱い無視する", "両辺をyで微分し、xを含む項はすべて無視する"], "a": 0, "ex": "陰関数微分では、y=…の形に変形しなくても、yをxの関数とみなして連鎖律を使いながら両辺をそのままxで微分できる。yの項を単純に無視するのは誤り。"}], "application": [{"formula": "", "q": "関数f(x)=x⁵の導関数を求めたい。どの公式を使うべきか？", "opts": ["∫xⁿ dx = xⁿ⁺¹/(n+1)+C", "f'(x)=nxⁿ⁻¹", "積の法則", "d/dx(sin x) = cos x"], "a": 1, "ex": "「導関数」を求める設問なので、微分の公式（べき関数の微分）を使う。指数が増える積分公式と混同しないこと。"}, {"formula": "", "q": "2つの関数の積として表されるy=x²sin xの導関数を求めたい。どの公式を使うべきか？", "opts": ["積の法則 d/dx(uv) = u·dv/dx + v·du/dx", "連鎖律 d/dx f(g(x)) = f'(g(x))・g'(x)", "∫xⁿ dx = xⁿ⁺¹/(n+1)+C", "f'(x)=nxⁿ⁻¹"], "a": 0, "ex": "「2つの別々の関数x²とsinxの掛け算」なので積の法則を使う。合成関数（関数の中に関数）ではないので連鎖律ではない。"}, {"formula": "", "q": "関数f(x)=sin(3x²+1)の導関数を求めたい。どの公式を使うべきか？", "opts": ["d/dx(sin x) = cos x をそのまま使う", "積の法則", "連鎖律 d/dx f(g(x)) = f'(g(x))・g'(x)", "∫xⁿ dx = xⁿ⁺¹/(n+1)+C"], "a": 2, "ex": "「sin(内側に別の関数)」という合成関数の形なので連鎖律を使う必要がある。sinxの基本公式をそのまま当てはめると、内側の関数の微分（掛け算すべき部分）が抜け落ちる。"}, {"formula": "", "q": "関数f(x)=x³の不定積分を求めたい。どの公式を使うべきか？", "opts": ["部分積分", "d/dx(sin x) = cos x", "f'(x)=nxⁿ⁻¹", "∫xⁿ dx = xⁿ⁺¹/(n+1)+C"], "a": 3, "ex": "「不定積分」を求める設問なので積分の公式を使う。微分の公式（指数が減る）を使うと逆の操作をしてしまう。"}, {"formula": "", "q": "y=x·eˣのような、2つの関数の積の積分を求めたい。どの公式を使うべきか？", "opts": ["d/dx(sin x) = cos x", "f'(x)=nxⁿ⁻¹", "部分積分 ∫u·dv/dx dx = uv - ∫v·du/dx dx", "積の法則（微分の公式）"], "a": 2, "ex": "積の「積分」を求めるので部分積分を使う。積の法則は積の「微分」の公式であり、この設問（積分）には使えない。"}, {"formula": "", "q": "定積分∫₀² (2x+1) dxの値を求めたい。どの操作を行うべきか？", "opts": ["不定積分を求めた後、上端2と下端0を代入して差を計算する", "不定積分を求めるだけで終わりとし、積分定数Cを付けて答えとする", "被積分関数2x+1を微分してから、上端と下端を代入する", "上端の値2をそのままxに代入した値のみを答えとする（下端は無視する）"], "a": 0, "ex": "定積分は不定積分を求めた後、上端の値を代入したものから下端の値を代入したものを引く。積分定数Cは引き算で消えるため付けない。"}, {"formula": "", "q": "x²+y²=25において、x=3, y=4のときのdy/dxを求めたい。どの考え方を使うべきか？", "opts": ["y=√(25-x²)の形に直してから微分する必要があり、陰関数微分は使えない", "陰関数微分を使い、両辺をxで微分してdy/dxについて解く", "xについての項だけを微分し、y²の項は無視する", "dy/dxを求めるにはyの値だけが分かれば十分で、xの値は不要である"], "a": 1, "ex": "陰関数のまま（y=の形に直さなくても）連鎖律を使って両辺をxで微分できる。x,y両方の値が分かって初めてdy/dxの数値が求まる。"}, {"formula": "", "q": "曲線y=x³-3x²の極値を求めたい。最初に行うべき操作はどれか？", "opts": ["y自体が最大・最小になるxの値を、直接方程式を解いて求める", "y'=0となるxの値を求め、その前後でy'の符号がどう変化するかを調べる", "y''(2階微分)がゼロになるxの値だけを求めれば、それが極値の位置である", "定積分∫y dxを計算し、その値が最大になる区間を探す"], "a": 1, "ex": "極値の候補はy'=0となる点。ただし、そこが実際に極大・極小であるかはy'の符号変化（またはy''の符号）で確認する必要があり、y'=0だけでは断定できない。"}]}};
const TYPE_META = {
  meaning:{label:"公式の意味", tag:"MEANING"},
  application:{label:"例題（どの公式？）", tag:"APPLICATION"}
};
let state = { chapter:"1", type:"meaning", idx:0, correctCount:0, answered:false, finished:false, selected:null, questions:[] };
function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  ["1","2","3","4","5"].forEach(ch=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (ch===state.chapter?' active':'');
    chip.textContent = ch;
    chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    nav.appendChild(chip);
  });
}
function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  const bank = QUESTION_BANK[state.chapter];
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    const n = bank[t].length;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleQuestion(q){
  const order = shuffleArray(q.opts.map((_,i)=>i));
  return { formula:q.formula, q:q.q, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a), ex:q.ex };
}
function resetQuiz(){
  state.idx=0; state.correctCount=0; state.answered=false; state.finished=false; state.selected=null;
  const base = QUESTION_BANK[state.chapter][state.type] || [];
  state.questions = shuffleArray(base).map(shuffleQuestion);
}
function currentQuestions(){ return state.questions; }
function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}
function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();
  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label} / ${QUESTION_BANK[state.chapter].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }
  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');
  const formulaBlock = state.type==='meaning' ? `<div class="formula-display">${q.formula}</div>` : '';
  area.innerHTML = `
    <div class="card">
      <div class="q-label">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${formulaBlock}
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}
function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}
function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){ state.finished = true; }
  else { state.idx++; state.answered=false; state.selected=null; }
  renderQuiz();
}
function render(){ renderChapterNav(); renderTypeTabs(); renderQuiz(); }
resetQuiz();
render();
</script>
