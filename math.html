<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学 AA 公式問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1E1A2E;
  --paper:#EAE6F0;
  --paper-card:#F7F5FA;
  --deep:#171226;
  --a1:#5B4E8C;
  --a2:#3E8C7A;
  --correct:#3E8C7A;
  --incorrect:#A63C34;
  --line: rgba(30,26,46,0.16);
}

*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP', sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

header.hero{background:var(--deep);color:var(--paper-card);padding:44px 20px 30px;border-bottom:6px solid var(--a2);}
.hero-inner{max-width:760px;margin:0 auto;}
.back-link{color:rgba(247,245,250,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;}
.eyebrow{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--a2);margin-top:14px;margin-bottom:10px;}
h1{font-family:'Fraunces', serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:0 0 6px;letter-spacing:-0.01em;}
.hero p.sub{margin:0;color:rgba(247,245,250,0.72);font-size:14.5px;}

.spectrum{margin-top:22px;height:10px;border-radius:6px;background:linear-gradient(90deg, var(--a1) 0%, var(--a1) 20%, #7A6BA8 40%, #5C9C8C 60%, var(--a2) 80%, var(--a2) 100%);}
.spectrum-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:0.04em;margin-top:6px;color:rgba(247,245,250,0.6);text-transform:uppercase;}

nav.chapters{display:flex;gap:6px;overflow-x:auto;padding:16px 20px 0;max-width:760px;margin:0 auto;}
.chip{flex:0 0 auto;font-family:'IBM Plex Mono', monospace;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--a1);border-color:var(--a1);color:var(--paper-card);}

.type-tabs{display:flex;margin:26px 0 4px;border-bottom:2px solid var(--line);}
.type-tab{flex:1;text-align:center;padding:12px 6px;font-family:'Fraunces', serif;font-weight:600;font-size:15px;color:rgba(30,26,46,0.45);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.type-tab .count{display:block;font-family:'IBM Plex Mono', monospace;font-weight:400;font-size:10.5px;margin-top:2px;letter-spacing:0.04em;}
.type-tab.active{color:var(--ink);border-bottom-color:var(--a2);}

.progress-row{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-family:'IBM Plex Mono', monospace;font-size:12px;color:rgba(30,26,46,0.55);}
.progress-track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--a2);border-radius:3px;transition:width .25s;}

.card{background:var(--paper-card);border:1px solid var(--line);border-radius:4px;padding:26px 24px 22px;margin-top:14px;box-shadow:0 1px 0 rgba(30,26,46,0.04);}
.q-label{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--a2);margin-bottom:10px;}
.q-text{font-family:'Fraunces', serif;font-size:18.5px;font-weight:500;line-height:1.6;margin:0 0 20px;}
.formula-display{font-family:'IBM Plex Mono', monospace;font-size:16.5px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:-8px 0 18px;text-align:center;letter-spacing:0.01em;word-break:break-word;}

.option{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:9px;font-family:'IBM Plex Sans JP', sans-serif;font-size:14.5px;color:var(--ink);cursor:pointer;transition:border-color .12s, background .12s;}
.option:hover:not(.locked){border-color:var(--a2);}
.option.correct{background:rgba(62,140,122,0.16);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(30,26,46,0.45);margin-right:8px;}

.explain{margin-top:16px;padding:14px 16px;border-left:3px solid var(--a1);background:rgba(91,78,140,0.08);font-size:13.5px;border-radius:0 3px 3px 0;display:none;}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--a1);}

.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{font-family:'IBM Plex Mono', monospace;font-size:12.5px;letter-spacing:0.03em;background:var(--deep);color:var(--paper-card);border:none;padding:10px 20px;border-radius:3px;cursor:pointer;display:none;}
button.next.show{display:inline-block;}
button.next:hover{background:#0e0a18;}

.result{text-align:center;padding:40px 20px;}
.result .score{font-family:'Fraunces', serif;font-size:56px;font-weight:700;color:var(--deep);}
.result .score span{font-size:22px;color:rgba(30,26,46,0.5);}
.result p{color:rgba(30,26,46,0.65);font-size:14px;}
button.retry{margin-top:14px;font-family:'IBM Plex Mono', monospace;font-size:12.5px;background:transparent;border:1px solid var(--deep);color:var(--deep);padding:9px 18px;border-radius:3px;cursor:pointer;}

footer.note{max-width:760px;margin:36px auto 0;padding:0 20px;font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(30,26,46,0.42);line-height:1.8;}
</style>
</head>

<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="index.html">← 科目選択に戻る</a>

  </div>
</header>

<nav class="chapters" id="chapterNav"></nav>

<div class="wrap">
  <div class="type-tabs" id="typeTabs"></div>

    <span id="progressLabel">1 / 9</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
</div>

<script>
const QUESTION_BANK = {"1":{"label":"1. 数と代数（Number and algebra）","meaning":[{"formula":"uₙ = u₁ + (n-1)d","q":"この公式の意味として正しいものは？","opts":["等差数列の第n項を、初項u1と公差dから求める式","等差数列の最初のn項の和を求める式","等比数列の第n項を、初項u1と公比rから求める式","無限に続く等比数列の総和を求める式"],"a":0,"ex":"等差数列の一般項の公式。"},{"formula":"Sₙ = n/2(2u₁+(n-1)d)","q":"この公式の意味として正しいものは？","opts":["等差数列の最初のn項の和Snを、初項u1と公差dから求める式","等比数列の最初のn項の和を求める式","無限に続く等比数列の総和を求める式","等比数列の第n項を求める式"],"a":0,"ex":"等差数列の和の公式。"},{"formula":"uₙ = u₁rⁿ⁻¹","q":"この公式の意味として正しいものは？","opts":["等差数列の最初のn項の和を求める式","等比数列の第n項を、初項u1と公比rから求める式","等差数列の第n項を求める式","無限に続く等比数列の総和を求める式"],"a":1,"ex":"等比数列の一般項の公式。"},{"formula":"S∞ = u₁/(1-r), |r|<1","q":"この公式の意味として正しいものは？","opts":["等比数列の最初のn項の和を求める式","等差数列の第n項を求める式","無限に続く等比数列（|r|<1）の総和を、初項u1と公比rから求める式","等差数列の最初のn項の和を求める式"],"a":2,"ex":"無限等比級数の和の公式。"},{"formula":"z = r(cosθ+isinθ) = re^(iθ)","q":"この公式の意味として正しいものは？","opts":["等比数列の一般項を表す式","無限等比級数の総和を表す式","複素数zを、絶対値rと偏角θを用いた極形式（オイラー形式）で表す式","等差数列の一般項を表す式"],"a":2,"ex":"複素数の極形式・オイラー形式。"}],"application":[{"formula":"uₙ = u₁ + (n-1)d","q":"初項3、公差5の等差数列の第10項を求めたい。どの公式を使うべきか？","opts":["uₙ = u₁rⁿ⁻¹","Sₙ = n/2(2u₁+(n-1)d)","S∞ = u₁/(1-r)","uₙ = u₁ + (n-1)d"],"a":3,"ex":"等差数列の一般項の公式を使う。"},{"formula":"Sₙ = n/2(2u₁+(n-1)d)","q":"初項3、公差5の等差数列の最初の10項の和を求めたい。どの公式を使うべきか？","opts":["S∞ = u₁/(1-r)","uₙ = u₁rⁿ⁻¹","Sₙ = n/2(2u₁+(n-1)d)","z = re^(iθ)"],"a":2,"ex":"等差数列の和の公式を使う。"},{"formula":"uₙ = u₁rⁿ⁻¹","q":"初項2、公比3の等比数列の第6項を求めたい。どの公式を使うべきか？","opts":["uₙ = u₁rⁿ⁻¹","Sₙ = n/2(2u₁+(n-1)d)","S∞ = u₁/(1-r)","uₙ = u₁ + (n-1)d"],"a":0,"ex":"等比数列の一般項の公式を使う。"},{"formula":"S∞ = u₁/(1-r)","q":"初項4、公比0.5の無限に続く等比数列の総和を求めたい。どの公式を使うべきか？","opts":["uₙ = u₁rⁿ⁻¹","uₙ = u₁ + (n-1)d","S∞ = u₁/(1-r)","Sₙ = n/2(2u₁+(n-1)d)"],"a":2,"ex":"無限等比級数の和の公式を使う。"},{"formula":"z = r(cosθ+isinθ)","q":"複素数z=1+iを極形式（絶対値と偏角）で表したい。どの公式を使うべきか？","opts":["z = r(cosθ+isinθ) = re^(iθ)","Sₙ = n/2(2u₁+(n-1)d)","S∞ = u₁/(1-r)","uₙ = u₁rⁿ⁻¹"],"a":0,"ex":"複素数の極形式への変換を使う。"}]},"2":{"label":"2. 関数（Functions）","meaning":[{"formula":"m = (y₂-y₁)/(x₂-x₁)", ベクトルの大きさの公式。"},{"formula":"v·w = |v||w|cosθ","q":"この公式の意味として正しいものは？","opts":["2つのベクトルv, wのなす角θを用いてスカラー積（内積）を表す式","平面の方程式を法線ベクトルを用いて表す式","ベクトルの大きさを成分から求める式","2つのベクトルが作る平行四辺形の面積を求める式"],"a":0,"ex":"スカラー積（内積）の定義。"},{"formula":"|v×w| = |v||w|sinθ","q":"この公式の意味として正しいものは？","opts":["ベクトルの大きさを成分から求める式","平面の方程式を法線ベクトルを用いて表す式","2つのベクトルv, wが作る平行四辺形の面積を、なす角θを用いて表すベクトル積の大きさ","ある点を通り、あるベクトルに平行な直線を表す式"],"a":2,"ex":"ベクトル積（外積）の大きさ。"},{"formula":"r = a + λb","q":"この公式の意味として正しいものは？","opts":["ベクトルの大きさを成分から求める式","平面の方程式を法線ベクトルを用いて表す式","2つのベクトルの内積を表す式","ある点aを通り、方向ベクトルbに平行な直線をベクトル形式で表す式"],"a":3,"ex":"直線のベクトル方程式。"},{"formula":"r·n = a·n","q":"この公式の意味として正しいものは？","opts":["法線ベクトルnと平面上の1点aを用いて平面の方程式を表す式","2つのベクトルが作る平行四辺形の面積を求める式","ベクトルの大きさを成分から求める式","直線のベクトル方程式を表す式"],"a":0,"ex":"平面の方程式（法線ベクトル形）。"}],"application":[{"formula":"|v| = √(v₁²+v₂²+v₃²)","q":"ベクトルv=(3,4,0)の大きさ（長さ）を求めたい。どの公式を使うべきか？","opts":["r = a + λb","|v×w| = |v||w|sinθ","v·w = |v||w|cosθ","|v| = √(v₁²+v₂²+v₃²)"],"a":3,"ex":"成分からベクトルの大きさを求める。"},{"formula":"v·w = |v||w|cosθ","q":"2つのベクトルv, wの内積と、それぞれの大きさが分かっているとき、2つのベクトルのなす角θを求めたい。どの公式を使うべきか？","opts":["v·w = |v||w|cosθ","r = a + λb","|v| = √(v₁²+v₂²+v₃²)","r·n = a·n"],"a":0,"ex":"内積の式から角度を求める。"},{"formula":"|v×w| = |v||w|sinθ","q":"2つのベクトルが作る平行四辺形の面積を求めたい。どの公式を使うべきか？","opts":["r = a + λb","|v×w| = |v||w|sinθ","|v| = √(v₁²+v₂²+v₃²)","r·n = a·n"],"a":1,"ex":"外積の大きさから面積を求める。"},{"formula":"r = a + λb","q":"ある点を通り、あるベクトルに平行な直線をベクトル形式で表したい。どの公式を使うべきか？","opts":["|v×w| = |v||w|sinθ","r·n = a·n","r = a + λb","v·w = |v||w|cosθ"],"a":2,"ex":"直線のベクトル方程式を使う。"},{"formula":"r·n = a·n","q":"法線ベクトルnと平面上の1点aが分かっているとき、その平面の方程式を求めたい。どの公式を使うべきか？","opts":["r = a + λb","r·n = a·n","|v| = √(v₁²+v₂²+v₃²)","v·w = |v||w|cosθ"],"a":1,"ex":"法線ベクトル形の平面の方程式を使う。"}]},"4":{"label":"4. 統計と確率（Statistics and probability）","meaning":[{"formula":"P(A∪B) = P(A)+P(B)-P(A∩B)","q":"この公式の意味として正しいものは？","opts":["事象Bが起こったという条件のもとで事象Aが起こる条件付き確率を求める式","事象AまたはBのどちらかが起こる確率を求める一般加法定理","確率変数Xの期待値を求める式","データを標準正規分布のz値に変換する式"],"a":1,"ex": き関数の微分公式。"},{"formula":"d/dx(uv) = u·dv/dx + v·du/dx","q":"この公式の意味として正しいものは？","opts":["部分積分の公式","関数の不定積分を求める式","べき関数の導関数を求める式","2つの関数u, vの積として表される関数を微分する積の法則"],"a":3,"ex":"積の法則（微分）。"},{"formula":"d/dx(sin x) = cos x","q":"この公式の意味として正しいものは？","opts":["関数f(x)=sin xの導関数がcos xであることを示す式","2つの関数の積を微分する積の法則","部分積分の公式","べき関数の不定積分を求める式"],"a":0,"ex":"三角関数sinxの標準微分。"},{"formula":"∫xⁿ dx = xⁿ⁺¹/(n+1) + C","q":"この公式の意味として正しいものは？","opts":["2つの関数の積の導関数を求める積の法則","三角関数の導関数を求める式","べき関数xⁿの不定積分を求める式","べき関数xⁿの導関数を求める式"],"a":2,"ex":"べき関数の積分公式。"},{"formula":"∫u·dv/dx dx = uv - ∫v·du/dx dx","q":"この公式の意味として正しいものは？","opts":["2つの関数の積として表される関数を積分するための部分積分の公式","三角関数の導関数を求める式","べき関数の導関数を求める式","べき関数の不定積分を求める式"],"a":0,"ex":"部分積分の公式。"}],"application":[{"formula":"f'(x)=nxⁿ⁻¹","q":"関数f(x)=x⁵の導関数を求めたい。どの公式を使うべきか？","opts":["∫xⁿ dx = xⁿ⁺¹/(n+1)+C","f'(x)=nxⁿ⁻¹","積の法則","d/dx(sin x) = cos x"],"a":1,"ex":"べき関数の微分公式を使う。"},{"formula":"積の法則","q":"2つの関数の積として表されるy=x²sin xの導関数を求めたい。どの公式を使うべきか？","opts":["積の法則 d/dx(uv) = u·dv/dx + v·du/dx","∫xⁿ dx = xⁿ⁺¹/(n+1)+C","f'(x)=nxⁿ⁻¹","部分積分"],"a":0,"ex":"積として表される関数には積の法則を使う。"},{"formula":"d/dx(sin x) = cos x","q":"関数f(x)=sin xの導関数を求めたい。どの公式を使うべきか？","opts":["d/dx(sin x) = cos x","部分積分","∫xⁿ dx = xⁿ⁺¹/(n+1)+C","積の法則"],"a":0,"ex":"三角関数sinxの標準微分を使う。"},{"formula":"∫xⁿ dx = xⁿ⁺¹/(n+1)+C","q":"関数f(x)=x³の不定積分を求めたい。どの公式を使うべきか？","opts":["部分積分","d/dx(sin x) = cos x","積の法則","∫xⁿ dx = xⁿ⁺¹/(n+1)+C"],"a":3,"ex":"べき関数の積分公式を使う。"},{"formula":"部分積分","q":"y=x·eˣのような、2つの関数の積の積分を求めたい。どの公式を使うべきか？","opts":["d/dx(sin x) = cos x","f'(x)=nxⁿ⁻¹","部分積分 ∫u·dv/dx dx = uv - ∫v·du/dx dx","積の法則"],"a":2,"ex":"積の積分には部分積分を使う。"}]}};
const TYPE_META = {
  meaning:{label:"公式の意味", tag:"MEANING"},
  application:{label:"例題（どの公式？）", tag:"APPLICATION"}
};

let state = { chapter:"1", type:"meaning", idx:0, correctCount:0, answered:false, finished:false };

function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  ["1","2","3","4","5"].forEach(ch=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (ch===state.chapter?' active':'');
    chip.textContent = ch;
    chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    nav.appendChild(chip);
  });
}

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  const bank = QUESTION_BANK[state.chapter];
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    const n = bank[t].length;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}

function resetQuiz(){ state.idx=0; state.correctCount=0; state.answered=false; state.finished=false; }
function currentQuestions(){ return QUESTION_BANK[state.chapter][state.type]; }

function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();

  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label} / ${QUESTION_BANK[state.chapter].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }

  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');

  const formulaBlock = state.type==='meaning' ? `<div class="formula-display">${q.formula}</div>` : '';

  area.innerHTML = `
    <div class="card">
      <div class="q-label">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${formulaBlock}
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}

function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}

function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){ state.finished = true; }
  else { state.idx++; state.answered=false; state.selected=null; }
  renderQuiz();
}

function render(){ renderChapterNav(); renderTypeTabs(); renderQuiz(); }
render();
</script>
