<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理 問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1E2A22;
  --paper:#EDE7D8;
  --paper-card:#F8F4E9;
  --deep:#16231C;
  --eco:#4F7A63;
  --anthro:#B8912E;
  --tech:#B5602D;
  --north:#3B6E8C;
  --south:#C1652E;
  --correct:#4F7A63;
  --incorrect:#A63C34;
  --line: rgba(30,42,34,0.16);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans JP', sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

/* ---------- Hero ---------- */
header.hero{
  background:var(--deep);
  color:var(--paper-card);
  padding:44px 20px 30px;
  border-bottom:6px solid var(--north);
}
.hero-inner{max-width:760px;margin:0 auto;}
.back-link{color:rgba(248,244,233,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--anthro);
  margin-top:14px;
  margin-bottom:10px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.hero p.sub{margin:0;color:rgba(248,244,233,0.72);font-size:14.5px;}

/* Spectrum bar — signature element: latitude gradient, North (cool) -> Equator -> South (warm),
   echoing the Global North / Global South theme that runs through this subject's content. */
.spectrum{
  margin-top:22px;
  height:10px;
  border-radius:6px;
  background:linear-gradient(90deg, var(--north) 0%, var(--north) 28%, var(--eco) 50%, var(--south) 72%, var(--south) 100%);
  position:relative;
}
.spectrum-labels{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.04em;
  margin-top:6px;
  color:rgba(248,244,233,0.6);
  text-transform:uppercase;
}

/* ---------- Chapter tabs ---------- */
nav.chapters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:16px 20px 0;
  max-width:760px;
  margin:0 auto;
}
.chip{
  flex:0 0 auto;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  padding:7px 13px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink);
  cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--north);border-color:var(--north);color:var(--paper-card);}
.chip.disabled{opacity:0.38;cursor:not-allowed;}

/* ---------- Type tabs ---------- */
.type-tabs{
  display:flex;
  margin:26px 0 4px;
  border-bottom:2px solid var(--line);
}
.type-tab{
  flex:1;
  text-align:center;
  padding:12px 6px;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:15px;
  color:rgba(30,42,34,0.45);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;
  transition:color .15s;
}
.type-tab .count{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-weight:400;
  font-size:10.5px;
  margin-top:2px;
  letter-spacing:0.04em;
}
.type-tab.active{color:var(--ink);border-bottom-color:var(--south);}

/* ---------- Progress ---------- */
.progress-row{
  display:flex;align-items:center;gap:10px;
  margin:18px 0 6px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:rgba(30,42,34,0.55);
}
.progress-track{
  flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;
}
.progress-fill{height:100%;background:var(--south);border-radius:3px;transition:width .25s;}

/* ---------- Card ---------- */
.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:26px 24px 22px;
  margin-top:14px;
  box-shadow:0 1px 0 rgba(30,42,34,0.04);
}
.q-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--south);
  margin-bottom:10px;
}
.q-text{
  font-family:'Fraunces', serif;
  font-size:18.5px;
  font-weight:500;
  line-height:1.55;
  margin:0 0 20px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:9px;
  font-family:'IBM Plex Sans JP', sans-serif;
  font-size:14.5px;
  color:var(--ink);
  cursor:pointer;
  transition:border-color .12s, background .12s;
}
.option:hover:not(.locked){border-color:var(--south);}
.option.correct{background:rgba(79,122,99,0.18);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(30,42,34,0.45);
  margin-right:8px;
}

.explain{
  margin-top:16px;
  padding:14px 16px;
  border-left:3px solid var(--north);
  background:rgba(59,110,140,0.08);
  font-size:13.5px;
  border-radius:0 3px 3px 0;
  display:none;
}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--north);}

.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  letter-spacing:0.03em;
  background:var(--deep);
  color:var(--paper-card);
  border:none;
  padding:10px 20px;
  border-radius:3px;
  cursor:pointer;
  display:none;
}
button.next.show{display:inline-block;}
button.next:hover{background:#0f1913;}

/* ---------- Result ---------- */
.result{
  text-align:center;
  padding:40px 20px;
}
.result .score{
  font-family:'Fraunces', serif;
  font-size:56px;
  font-weight:700;
  color:var(--deep);
}
.result .score span{font-size:22px;color:rgba(30,42,34,0.5);}
.result p{color:rgba(30,42,34,0.65);font-size:14px;}
button.retry{
  margin-top:14px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  background:transparent;
  border:1px solid var(--deep);
  color:var(--deep);
  padding:9px 18px;
  border-radius:3px;
  cursor:pointer;
}

footer.note{
  max-width:760px;margin:36px auto 0;padding:0 20px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(30,42,34,0.42);
  line-height:1.8;
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="hub.html">← 科目選択に戻る</a>
    <div class="eyebrow">IBDP · Geography · SL</div>
    <h1>地理 問題集</h1>
    <p class="sub">単語系 / 関連性形 / ケーススタディ系 — ユニットごとの演習アプリ（構築中：現在4ユニット収録）</p>
    <div class="spectrum"></div>
    <div class="spectrum-labels"><span>Global North</span><span>Equator</span><span>Global South</span></div>
  </div>
</header>

<nav class="chapters" id="chapterNav"></nav>

<div class="wrap">
  <div class="type-tabs" id="typeTabs"></div>
  <div class="progress-row">
    <span id="progressLabel">1 / 9</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
</div>

       opts:["施設の階層（Leisure hierarchy）は、その施設が存続するために必要な最低人口数（Population threshold）とも関連しており、より高次の施設ほど高いThresholdを必要とする傾向がある","両者は無関係である","Population thresholdはLeisure hierarchyと常に反比例する","Leisure hierarchyは常に人口と無関係に決まる"],

       opts:["Honeypot brandingは、ある場所をHotspot化させる（観光客を集中的に呼び込む）ための戦略として機能しうる","両者は対立する概念である","Honeypot brandingはHotspotを解消するための手法である","両者は無関係である"],
       a:0, ex:"ブランディングによるHotspot化。"},
      {q:"「Primary tourist」「Secondary tourist」と観光地の経済構造の関係として正しいものは？",
       opts:["Primary touristとなる観光資源（自然・文化遺産など）が人を惹きつけ、その周辺にSecondary touristの要素（宿泊・飲食・娯楽）が発展する、相互に補完的な関係にある","両者は無関係な独立した経済セクターである","Secondary touristの要素が常に先に存在する","Primary touristの要素は経済に影響しない"],

       opts:["Sphere of influence（広い範囲）","Population threshold","Leisure hierarchyの最下層","Centrifugal movements"],
       a:0, ex:"広範囲からの集客。"},

       a:0, ex:"特化型・低負荷の観光形態。"},

       opts:["Types of sportの分類軸（季節・団体/個人・ボール使用有無・海洋/陸上）","Leisure hierarchyの軸","Population thresholdの軸","Sphere of influenceの軸"],
       a:0, ex:"スポーツの複数分類軸。"}

const TYPE_META = {
  vocab:{label:"単語系", tag:"VOCAB"},
  relation:{label:"関連性形", tag:"RELATION"},
  case:{label:"ケーススタディ系", tag:"CASE"}
};

let state = { chapter:"1", type:"vocab", idx:0, correctCount:0, answered:false, finished:false };

function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  const shown = ["1","2","3","4"];
  shown.forEach(ch=>{
    const chip = document.createElement('div');
    const available = !!QUESTION_BANK[ch];
    chip.className = 'chip' + (ch===state.chapter?' active':'') + (!available?' disabled':'');
    chip.textContent = available ? QUESTION_BANK[ch].label : (ch + ' ・準備中');
    if(available){
      chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    }
    nav.appendChild(chip);
  });
}

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  const bank = QUESTION_BANK[state.chapter];
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    const n = bank[t] ? bank[t].length : 0;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}

function resetQuiz(){
  state.idx = 0; state.correctCount = 0; state.answered = false; state.finished = false;
}

function currentQuestions(){
  return QUESTION_BANK[state.chapter][state.type];
}

function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();

  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label} / ${QUESTION_BANK[state.chapter].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }

  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <div class="q-label">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}

function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}

function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){
    state.finished = true;
  } else {
    state.idx++;
    state.answered = false;
    state.selected = null;
  }
  renderQuiz();
}

function render(){
  renderChapterNav();
  renderTypeTabs();
  renderQuiz();
}

render();
</script>
