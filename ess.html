<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESS 問題集 — Chapter 1.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1E2A22;
  --paper:#EDE7D8;
  --paper-card:#F8F4E9;
  --deep:#16231C;
  --eco:#4F7A63;
  --anthro:#B8912E;
  --tech:#B5602D;
  --correct:#4F7A63;
  --incorrect:#A63C34;
  --line: rgba(30,42,34,0.16);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans JP', sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

/* ---------- Hero ---------- */
header.hero{
  background:var(--deep);
  color:var(--paper-card);
  padding:44px 20px 30px;
  border-bottom:6px solid var(--eco);
}
.hero-inner{max-width:760px;margin:0 auto;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--anthro);
  margin-bottom:10px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.hero p.sub{margin:0;color:rgba(248,244,233,0.72);font-size:14.5px;}

/* Spectrum bar — signature element (EVS: ecocentric → anthropocentric → technocentric) */
.spectrum{
  margin-top:22px;
  height:10px;
  border-radius:6px;
  background:linear-gradient(90deg, var(--eco) 0%, var(--eco) 30%, var(--anthro) 50%, var(--tech) 70%, var(--tech) 100%);
  position:relative;
}
.spectrum-labels{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.04em;
  margin-top:6px;
  color:rgba(248,244,233,0.6);
  text-transform:uppercase;
}

/* ---------- Chapter tabs ---------- */
nav.chapters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:16px 20px 0;
  max-width:760px;
  margin:0 auto;
}
.chip{
  flex:0 0 auto;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  padding:7px 13px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink);
  cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--eco);border-color:var(--eco);color:var(--paper-card);}
.chip.disabled{opacity:0.38;cursor:not-allowed;}

/* ---------- Type tabs ---------- */
.type-tabs{
  display:flex;
  margin:26px 0 4px;
  border-bottom:2px solid var(--line);
}
.type-tab{
  flex:1;
  text-align:center;
  padding:12px 6px;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:15px;
  color:rgba(30,42,34,0.45);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;
  transition:color .15s;
}
.type-tab .count{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-weight:400;
  font-size:10.5px;
  margin-top:2px;
  letter-spacing:0.04em;
}
.type-tab.active{color:var(--ink);border-bottom-color:var(--tech);}

/* ---------- Progress ---------- */
.progress-row{
  display:flex;align-items:center;gap:10px;
  margin:18px 0 6px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:rgba(30,42,34,0.55);
}
.progress-track{
  flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;
}
.progress-fill{height:100%;background:var(--tech);border-radius:3px;transition:width .25s;}

/* ---------- Card ---------- */
.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:26px 24px 22px;
  margin-top:14px;
  box-shadow:0 1px 0 rgba(30,42,34,0.04);
}
.q-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--tech);
  margin-bottom:10px;
}
.q-text{
  font-family:'Fraunces', serif;
  font-size:18.5px;
  font-weight:500;
  line-height:1.55;
  margin:0 0 20px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:9px;
  font-family:'IBM Plex Sans JP', sans-serif;
  font-size:14.5px;
  color:var(--ink);
  cursor:pointer;
  transition:border-color .12s, background .12s;
}
.option:hover:not(.locked){border-color:var(--tech);}
.option.correct{background:rgba(79,122,99,0.18);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(30,42,34,0.45);
  margin-right:8px;
}

.explain{
  margin-top:16px;
  padding:14px 16px;
  border-left:3px solid var(--eco);
  background:rgba(79,122,99,0.08);
  font-size:13.5px;
  border-radius:0 3px 3px 0;
  display:none;
}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--eco);}

.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  letter-spacing:0.03em;
  background:var(--deep);
  color:var(--paper-card);
  border:none;
  padding:10px 20px;
  border-radius:3px;
  cursor:pointer;
  display:none;
}
button.next.show{display:inline-block;}
button.next:hover{background:#0f1913;}

/* ---------- Result ---------- */
.result{
  text-align:center;
  padding:40px 20px;
}
.result .score{
  font-family:'Fraunces', serif;
  font-size:56px;
  font-weight:700;
  color:var(--deep);
}
.result .score span{font-size:22px;color:rgba(30,42,34,0.5);}
.result p{color:rgba(30,42,34,0.65);font-size:14px;}
button.retry{
  margin-top:14px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  background:transparent;
  border:1px solid var(--deep);
  color:var(--deep);
  padding:9px 18px;
  border-radius:3px;
  cursor:pointer;
}

footer.note{
  max-width:760px;margin:36px auto 0;padding:0 20px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:rgba(30,42,34,0.42);
  line-height:1.8;
}
</style>
</head>

<script>
const QUESTION_BANK = {"1.1":{"label":"1.1 環境価値観システム","vocab":[{"q":"「Environmental value system (EVS)」の定義として最も適切なものは？","opts":["自然そのものに本質的価値を置き、小規模・低技術志向の生き方を志向する","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する","技術発展が環境問題への解決策を提供できると信じる世界観","私たちの視点に影響を与える入力と、その視点から生まれる出力を示すモデル"],"a":3,"ex":"EVSは、文化的・宗教的・経済的・社会政治的な文脈（入力）が個人の環境に対する見方（出力）を形成する、というモデルとして定義される（Oxford ESS Course Companion, p.17）。"},{"q":"「Ecocentric」な世界観の特徴として正しいものは？","opts":["自然そのものに本質的価値を置き、小規模・低技術志向の生き方を志向する","極端なTechnocentrist","NGO＝非政府の独立した圧力団体（例：WWF, Greenpeace）、GO＝政府組織、IGO＝加盟国から成る政府間組織","私たちの視点に影響を与える入力と、その視点から生まれる出力を示すモデル"],"a":0,"ex":"Ecocentricは生態系・自然を中心に据え、物質主義的でない小規模・低技術のアプローチを好む世界観（p.18）。"},{"q":"「Anthropocentric」の説明として適切なものは？","opts":["技術発展が環境問題への解決策を提供できると信じる世界観","1960年代に公式に始まったとされる、環境保護に関する社会的・政治的運動","Technocentric（規制や技術による持続可能な管理を重視）","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する"],"a":3,"ex":"Anthropocentricは人間中心の世界観で、人間が地球規模のシステムを持続可能に管理すべきだと考える（p.19）。"},{"q":"「Technocentric」の定義は？","opts":["技術発展が環境問題への解決策を提供できると信じる世界観","Technocentric（規制や技術による持続可能な管理を重視）","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する","NGO＝非政府の独立した圧力団体（例：WWF, Greenpeace）、GO＝政府組織、IGO＝加盟国から成る政府間組織"],"a":0,"ex":"Technocentricは、技術によってあらゆる環境問題が解決可能だと信じる世界観（p.19）。"},{"q":"「Deep ecologist」とは？","opts":["私たちの視点に影響を与える入力と、その視点から生まれる出力を示すモデル","1960年代に公式に始まったとされる、環境保護に関する社会的・政治的運動","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する","自然の精神的価値のために無条件の保全を信じる、極端なEcocentrist"],"a":3,"ex":"Deep ecologistは、自然保護を人間への利益のためではなく自然そのものの精神的価値のために無条件に行うべきと考える、極端なEcocentrist（p.18, p.20）。"},{"q":"「Environmental manager」はEVSスペクトル上でどこに位置づけられるか？","opts":["Technocentric（規制や技術による持続可能な管理を重視）","自然そのものに本質的価値を置き、小規模・低技術志向の生き方を志向する","自然の精神的価値のために無条件の保全を信じる、極端なEcocentrist","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する"],"a":0,"ex":"テキストでは「environmental managers are technocentrists」と明記されている。人類への財・サービス供給を持続可能な形で続けるための管理者という位置づけ（p.20, p.73）。"},{"q":"「Cornucopian」とは？","opts":["Technocentric（規制や技術による持続可能な管理を重視）","人間を存在の中心と見なし、税制・規制・法律による持続可能な管理を重視する","極端なTechnocentrist","NGO＝非政府の独立した圧力団体（例：WWF, Greenpeace）、GO＝政府組織、IGO＝加盟国から成る政府間組織"],"a":2,"ex":"Cornucopianは極端なTechnocentrist（p.73）。資源は技術によって無限に代替可能だと考える立場。"},{"q":"「Environmental Movement」の説明として正しいものは？","opts":["極端なTechnocentrist","1960年代に公式に始まったとされる、環境保護に関する社会的・政治的運動","技術発展が環境問題への解決策を提供できると信じる世界観","NGO＝非政府の独立した圧力団体（例：WWF, Greenpeace）、GO＝政府組織、IGO＝加盟国から成る政府間組織"],"a":1,"ex":"公式には1960年代に始まったとされるが、古代ローマの大気・水質汚染への言及など、人間はそれ以前から環境への影響を認識していた（p.19）。"},{"q":"NGO・GO・IGOの組み合わせとして正しいものは？","opts":["自然そのものに本質的価値を置き、小規模・低技術志向の生き方を志向する","極端なTechnocentrist","Technocentric（規制や技術による持続可能な管理を重視）","NGO＝非政府の独立した圧力団体（例：WWF, Greenpeace）、GO＝政府組織、IGO＝加盟国から成る政府間組織"],"a":3,"ex":"NGOは政府から独立した圧力団体（例：WWF、Greenpeace、Friends of the Earth）、GOは政府組織、IGOは加盟国から成る政府間組織（p.20）。"}],"relation":[{"q":"EVSスペクトル上で、Ecocentric・Anthropocentric・Technocentricを「自然中心度が高い順」に並べると？","opts":["前者は自然に本質的価値を置き、後者は人間中心の管理を重視する点","Ecocentric → Anthropocentric → Technocentric","Deep ecologistは極端なEcocentristである","環境運動は1960年代に公式に始まったとされるが、それ以前にも人間による環境への影響は認識されていた（例：古代ローマの大気・水質汚染への言及）"],"a":1,"ex":"EVSは連続的なスペクトルであり、自然中心度が高い順にEcocentric→Anthropocentric→Technocentricと並ぶ。"},{"q":"「Deep ecologist」と「Ecocentric」の関係として正しいのは？","opts":["NGO＝独立した非政府団体、GO＝一国の政府機関、IGO＝複数国家が加盟する組織","文化的・宗教的・経済的・社会政治的文脈が入力となり、個人の環境に対する視点（世界観）が出力として形成される","Deep ecologistは極端なEcocentristである","Cornucopianは極端なTechnocentristである"],"a":2,"ex":"Deep ecologistはEcocentricの中でも最も極端な立場（p.18, p.20）。"},{"q":"「Cornucopian」と「Technocentric」の関係は？","opts":["Deep ecologistは極端なEcocentristである","環境運動は1960年代に公式に始まったとされるが、それ以前にも人間による環境への影響は認識されていた（例：古代ローマの大気・水質汚染への言及）","Cornucopianは極端なTechnocentristである","Ecocentric → Anthropocentric → Technocentric"],"a":2,"ex":"Cornucopianは極端なTechnocentrist（p.73）。Deep ecologist（極端なEcocentric）と対をなす存在として捉えられる。"},{"q":"「Environmental manager」と「Technocentric」の関係として正しいものは？","opts":["環境運動は1960年代に公式に始まったとされるが、それ以前にも人間による環境への影響は認識されていた（例：古代ローマの大気・水質汚染への言及）","前者は自然に本質的価値を置き、後者は人間中心の管理を重視する点","NGO＝独立した非政府団体、GO＝一国の政府機関、IGO＝複数国家が加盟する組織","Environmental managerはTechnocentristの一種と位置づけられる"],"a":3,"ex":"テキストで明記されている通り、Environmental managerはTechnocentristに分類される。"},{"q":"NGO・GO・IGOを「運営主体」の違いで分類した場合、正しい関係性は？","opts":["NGO＝独立した非政府団体、GO＝一国の政府機関、IGO＝複数国家が加盟する組織","Deep ecologistは極端なEcocentristである","文化的・宗教的・経済的・社会政治的文脈が入力となり、個人の環境に対する視点（世界観）が出力として形成される","Cornucopianは極端なTechnocentristである"],"a":0,"ex":"運営主体の違いに注目すると、NGOは独立団体、GOは一国の政府、IGOは複数国家の連合体という階層関係になる。"},{"q":"Ecocentric的立場とAnthropocentric的立場の最も本質的な違いは何か？","opts":["NGO＝独立した非政府団体、GO＝一国の政府機関、IGO＝複数国家が加盟する組織","Cornucopianは極端なTechnocentristである","Environmental managerはTechnocentristの一種と位置づけられる","前者は自然に本質的価値を置き、後者は人間中心の管理を重視する点"],"a":3,"ex":"Ecocentricは自然そのものに内在的価値を置くのに対し、Anthropocentricは人間を中心とした持続可能な管理を志向する。"},{"q":"EVSモデルにおける「入力」と「出力」の関係として正しいものは？","opts":["環境運動は1960年代に公式に始まったとされるが、それ以前にも人間による環境への影響は認識されていた（例：古代ローマの大気・水質汚染への言及）","Environmental managerはTechnocentristの一種と位置づけられる","文化的・宗教的・経済的・社会政治的文脈が入力となり、個人の環境に対する視点（世界観）が出力として形成される","Cornucopianは極端なTechnocentristである"],"a":2,"ex":"EVSは、様々な文脈的要因（入力）が個人の環境に対する視点・行動（出力）を形作るというモデル（p.17）。"},{"q":"「Environmental Movement」の発生時期と、それ以前の人間活動の関係として正しい記述は？","opts":["前者は自然に本質的価値を置き、後者は人間中心の管理を重視する点","Environmental managerはTechnocentristの一種と位置づけられる","Cornucopianは極端なTechnocentristである","環境運動は1960年代に公式に始まったとされるが、それ以前にも人間による環境への影響は認識されていた（例：古代ローマの大気・水質汚染への言及）"],"a":3,"ex":"環境運動そのものは1960年代の産物だが、環境への人為的影響への「気づき」自体はそれよりずっと古い（p.19）。"}],"case":[{"q":"グリーンピースが企業に対し森林破壊への抗議キャンペーンを行った。この団体はEVSの文脈でどう分類されるか？","opts":["Deep ecologist（極端なEcocentric）","NGO","NGO（Ecocentric寄りの立場を取ることが多い）","IGO（政府間組織）"],"a":2,"ex":"グリーンピースは政府から独立した非政府組織（NGO）の代表例。"},{"q":"ある国の政府が、漁業資源の乱獲を防ぐために漁獲量規制と課税制度を導入した。この政府の姿勢はEVSスペクトル上でどれに最も近いか？","opts":["Anthropocentric（規制・法整備による持続可能な管理）","IGO（政府間組織）","Deep ecologist（極端なEcocentric）","NGO（Ecocentric寄りの立場を取ることが多い）"],"a":0,"ex":"税制・規制を通じた人間中心の持続可能な管理は、Anthropocentric（およびそこに含まれるEnvironmental manager的立場）の典型例。"},{"q":"気候変動対策として、大気中のCO2を直接回収する技術（Direct Air Capture）への大規模投資のみに頼り、ライフスタイルの変更は不要だと主張する立場は？","opts":["NGO（Ecocentric寄りの立場を取ることが多い）","Cornucopian（極端なTechnocentric）","IGO","Technocentric（Cornucopian寄り）"], const TYPE_META = {
  vocab:{label:"単語系", tag:"VOCAB"},
  relation:{label:"関連性形", tag:"RELATION"},
  case:{label:"ケーススタディ系", tag:"CASE"}
};

let state = { chapter:"1.1", type:"vocab", idx:0, correctCount:0, answered:false, finished:false };

function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  // Reflects the actual ESS Course Companion subtopic structure covered in the project's notes
  const shown = ["1.1","1.2","1.3","2.1","2.2","2.3","2.4","2.5","3.1","3.2","3.3","4.1","4.2","4.3","5.1","5.2"];
  shown.forEach(ch=>{
    const chip = document.createElement('div');
    const available = !!QUESTION_BANK[ch];
    chip.className = 'chip' + (ch===state.chapter?' active':'') + (!available?' disabled':'');
    chip.textContent = ch + (available?'':' ・準備中');
    if(available){
      chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    }
    nav.appendChild(chip);
  });
}

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  const bank = QUESTION_BANK[state.chapter];
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    const n = bank[t] ? bank[t].length : 0;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}

function resetQuiz(){
  state.idx = 0; state.correctCount = 0; state.answered = false; state.finished = false;
}

function currentQuestions(){
  return QUESTION_BANK[state.chapter][state.type];
}

function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();

  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label} / Chapter ${state.chapter}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }

  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <div class="q-label">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}

function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}

function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){
    state.finished = true;
  } else {
    state.idx++;
    state.answered = false;
    state.selected = null;
  }
  renderQuiz();
}

function render(){
  renderChapterNav();
  renderTypeTabs();
  renderQuiz();
}

render();
</script>
</body>
</html>
