<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理 公式問題集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1A2233;
  --paper:#E6E9EE;
  --paper-card:#F5F7FA;
  --deep:#12182A;
  --a1:#3E6B9C;
  --a2:#C77B3E;
  --correct:#3E6B9C;
  --incorrect:#A63C34;
  --line: rgba(26,34,51,0.16);
}

*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP', sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

header.hero{background:var(--deep);color:var(--paper-card);padding:44px 20px 30px;border-bottom:6px solid var(--a1);}
.hero-inner{max-width:760px;margin:0 auto;}
.back-link{color:rgba(245,247,250,0.6);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;}
.eyebrow{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--a2);margin-top:14px;margin-bottom:10px;}
h1{font-family:'Fraunces', serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:0 0 6px;letter-spacing:-0.01em;}
.hero p.sub{margin:0;color:rgba(245,247,250,0.72);font-size:14.5px;}

/* Signature: an orbit-like dial marking the 5 theme groups A-E */
.spectrum{margin-top:22px;height:10px;border-radius:6px;background:linear-gradient(90deg, var(--a1) 0%, var(--a1) 20%, #6B8FAE 40%, #A8896B 60%, var(--a2) 80%, var(--a2) 100%);}
.spectrum-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:0.04em;margin-top:6px;color:rgba(245,247,250,0.6);text-transform:uppercase;}

nav.chapters{display:flex;gap:6px;overflow-x:auto;padding:16px 20px 0;max-width:760px;margin:0 auto;}
.chip{flex:0 0 auto;font-family:'IBM Plex Mono', monospace;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--a1);border-color:var(--a1);color:var(--paper-card);}

.type-tabs{display:flex;margin:26px 0 4px;border-bottom:2px solid var(--line);}
.type-tab{flex:1;text-align:center;padding:12px 6px;font-family:'Fraunces', serif;font-weight:600;font-size:15px;color:rgba(26,34,51,0.45);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.type-tab .count{display:block;font-family:'IBM Plex Mono', monospace;font-weight:400;font-size:10.5px;margin-top:2px;letter-spacing:0.04em;}
.type-tab.active{color:var(--ink);border-bottom-color:var(--a2);}

.progress-row{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-family:'IBM Plex Mono', monospace;font-size:12px;color:rgba(26,34,51,0.55);}
.progress-track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--a2);border-radius:3px;transition:width .25s;}

.card{background:var(--paper-card);border:1px solid var(--line);border-radius:4px;padding:26px 24px 22px;margin-top:14px;box-shadow:0 1px 0 rgba(26,34,51,0.04);}
.q-label{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--a2);margin-bottom:10px;}
.q-text{font-family:'Fraunces', serif;font-size:18.5px;font-weight:500;line-height:1.6;margin:0 0 20px;}
.formula-display{font-family:'IBM Plex Mono', monospace;font-size:17px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:-8px 0 18px;text-align:center;letter-spacing:0.02em;}

.option{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:9px;font-family:'IBM Plex Sans JP', sans-serif;font-size:14.5px;color:var(--ink);cursor:pointer;transition:border-color .12s, background .12s;}
.option:hover:not(.locked){border-color:var(--a2);}
.option.correct{background:rgba(62,107,156,0.16);border-color:var(--correct);}
.option.incorrect{background:rgba(166,60,52,0.14);border-color:var(--incorrect);}
.option.locked{cursor:default;}
.option .tag{font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(26,34,51,0.45);margin-right:8px;}

.explain{margin-top:16px;padding:14px 16px;border-left:3px solid var(--a1);background:rgba(62,107,156,0.08);font-size:13.5px;border-radius:0 3px 3px 0;display:none;}
.explain.show{display:block;}
.explain b{font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px;color:var(--a1);}

.actions{display:flex;justify-content:flex-end;margin-top:18px;}
button.next{font-family:'IBM Plex Mono', monospace;font-size:12.5px;letter-spacing:0.03em;background:var(--deep);color:var(--paper-card);border:none;padding:10px 20px;border-radius:3px;cursor:pointer;display:none;}
button.next.show{display:inline-block;}
button.next:hover{background:#0a0e19;}

.result{text-align:center;padding:40px 20px;}
.result .score{font-family:'Fraunces', serif;font-size:56px;font-weight:700;color:var(--deep);}
.result .score span{font-size:22px;color:rgba(26,34,51,0.5);}
.result p{color:rgba(26,34,51,0.65);font-size:14px;}
button.retry{margin-top:14px;font-family:'IBM Plex Mono', monospace;font-size:12.5px;background:transparent;border:1px solid var(--deep);color:var(--deep);padding:9px 18px;border-radius:3px;cursor:pointer;}

footer.note{max-width:760px;margin:36px auto 0;padding:0 20px;font-family:'IBM Plex Mono', monospace;font-size:11px;color:rgba(26,34,51,0.42);line-height:1.8;}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="index.html">← 科目選択に戻る</a>
    <div class="eyebrow">IBDP · Physics · HL</div>
    <h1>物理 公式問題集</h1>
    <p class="sub">公式の意味 / 例題（どの公式を使うか）— テーマA〜Eの5分野を収録</p>
    <div class="spectrum"></div>
    <div class="spectrum-labels"><span>A 力学</span><span>B 物質</span><span>C 波動</span><span>D 場</span><span>E 量子核</span></div>
  </div>
</header>

<nav class="chapters" id="chapterNav"></nav>

<div class="wrap">
  <div class="type-tabs" id="typeTabs"></div>
  <div class="progress-row">
    <span id="progressLabel">1 / 9</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
</div>

<footer class="note">IB Physics HL公式集（2025年版シラバス Theme A〜E）に基づく。「意味」は公式が何を表すかを問い、「例題」は与えられた状況でどの公式を使うべきかを問う。</footer>

<script>
const QUESTION_BANK = {"A":{"label":"A. 力学（Space, time and motion）","meaning":[{"formula":"v = u + at","q":"この公式の意味として正しいものは？","opts":["質量mと速度vの積として定義される運動量を表す式","質量m、速度vの物体が持つ運動エネルギーを表す式","初速度u、一定の加速度a、経過時間tから、t秒後の速度vを求める運動方程式","力Fがθの角度で距離s物体を移動させたときになす仕事を表す式"],"a":2,"ex":"SUVAT方程式の一つ。等加速度直線運動における速度の式。"},{"formula":"E_k = ½mv²","q":"この公式の意味として正しいものは？","opts":["質量mと速度vの積として定義される運動量を表す式","初速度u、加速度a、時間tから速度vを求める式","質量m、速度vの物体が持つ運動エネルギーを表す式","質量mの物体に力Fが働くときの加速度aとの関係を示す式"],"a":2,"ex":"運動エネルギーの定義式。"},{"formula":"F = ma","q":"この公式の意味として正しいものは？","opts":["力Fが物体をθの角度で距離s移動させたときになす仕事を表す式","質量mと速度vの積として定義される運動量を表す式","初速度u、加速度a、時間tから速度vを求める式","質量mの物体に力Fが働くとき生じる加速度aとの関係を示すニュートンの第二法則"],"a":3,"ex":"ニュートンの運動方程式（第二法則）。"},{"formula":"p = mv","q":"この公式の意味として正しいものは？","opts":["力Fが物体をθの角度で距離s移動させたときになす仕事を表す式","質量mの物体に力Fが働くときの加速度aとの関係を示す式","質量mと速度vの積として定義される運動量を表す式","質量m、速度vの物体が持つ運動エネルギーを表す式"],"a":2,"ex":"運動量の定義式。"},{"formula":"W = Fs cosθ","q":"この公式の意味として正しいものは？","opts":["質量mと速度vの積として定義される運動量を表す式","力Fがθの角度で距離s物体を移動させたときになす仕事を表す式","初速度u、加速度a、時間tから速度vを求める式","質量mの物体に力Fが働くときの加速度aとの関係を示す式"],"a":1,"ex":"仕事の定義式。力と移動方向のなす角θを考慮する。"}],"application":[{"formula":"v = u + at","q":"静止していた車が一定の加速度3.0 m/s²で5.0秒間加速した。5.0秒後の速度を求めたい。どの公式を使うべきか？","opts":["E_k = ½mv²","v = u + at","p = mv","F = ma"],"a":1,"ex":"初速度・加速度・時間から速度を求めるので v=u+at。"},{"formula":"E_k = ½mv²","q":"質量2.0kgの物体が速さ4.0 m/sで運動している。この物体の運動エネルギーを求めたい。どの公式を使うべきか？","opts":["E_k = ½mv²","p = mv","W = Fs cosθ","v = u + at"],"a":0,"ex":"質量と速度から運動エネルギーを求めるので E_k=½mv²。"},{"formula":"F = ma","q":"質量5.0kgの物体に力を加えたところ加速度2.0 m/s²が生じた。この力の大きさを求めたい。どの公式を使うべきか？","opts":["F = ma","E_k = ½mv²","p = mv","W = Fs cosθ"],"a":0,"ex":"質量と加速度から力を求めるので F=ma。"},{"formula":"p = mv","q":"質量0.5kgのボールが速さ10 m/sで飛んでいる。このボールの運動量を求めたい。どの公式を使うべきか？","opts":["F = ma","p = mv","v = u + at","E_k = ½mv²"],"a":1,"ex":"質量と速度から運動量を求めるので p=mv。"},{"formula":"W = Fs cosθ","q":"20Nの力で物体を水平方向に5.0m引きずった（力の方向と移動方向は同じ）。このときになされた仕事を求めたい。どの公式を使うべきか？","opts":["p = mv","W = Fs cosθ","F = ma","v = u + at"],"a":1,"ex":"力・移動距離・角度から仕事を求めるので W=Fscosθ。"}]},"B":{"label":"B. 物質（Particulate nature of matter）","meaning":[{"formula":"PV = nRT","q":"この公式の意味として正しいものは？","opts":["電流Iと電圧Vの積として電力Pを求める式","抵抗Rを電圧Vと電流Iの比として定義するオームの法則","理想気体の圧力P、体積V、物質量n、絶対温度Tの関係を示す状態方程式","質量m、比熱cの物質の温度をΔT変化させるのに必要な熱量を表す式"],"a":2,"ex":"理想気体の状態方程式。"},{"formula":"Q = mcΔT","q":"この公式の意味として正しいものは？","opts":["系に加えられた熱量が内部エネルギー変化と仕事の和に等しいという式","理想気体の圧力・体積・物質量・絶対温度の関係を示す式","質量m、比熱cの物質の温度をΔTだけ変化させるのに必要な熱量Qを表す式","電流Iと電圧Vの積として電力Pを求める式"],"a":2,"ex":"比熱に基づく熱量の式。"},{"formula":"R = V/I","q":"この公式の意味として正しいものは？","opts":["質量m、比熱cの物質の温度をΔT変化させるのに必要な熱量を表す式","電流Iと電圧Vの積として電力Pを求める式","理想気体の圧力・体積・物質量・絶対温度の関係を示す式","抵抗Rを、電圧Vと電流Iの比として定義するオームの法則"],"a":3,"ex":"オームの法則。"},{"formula":"P = IV","q":"この公式の意味として正しいものは？","opts":["理想気体の圧力・体積・物質量・絶対温度の関係を示す式","抵抗Rを電圧Vと電流Iの比として定義する式","質量m、比熱cの物質の温度をΔT変化させるのに必要な熱量を表す式","電流Iと電圧Vの積として電力Pを求める式"],"a":3,"ex":"電力の定義式。"},{"formula":"Q = ΔU + W","q":"この公式の意味として正しいものは？","opts":["系に加えられた熱量Qが、内部エネルギーの変化ΔUと系がした仕事Wの和に等しいという熱力学第一法則","電流Iと電圧Vの積として電力Pを求める式","抵抗Rを電圧Vと電流Iの比として定義する式","理想気体の圧力・体積・物質量・絶対温度の関係を示す式"],"a":0,"ex":"熱力学第一法則。"}],"application":[{"formula":"PV = nRT","q":"密閉容器内の気体の物質量n、絶対温度Tが分かっているとき、圧力Pと体積Vの関係を求めたい。どの公式を使うべきか？","opts":["P = IV","PV = nRT","R = V/I","Q = mcΔT"],"a":1,"ex":"理想気体の状態方程式を使う。"},{"formula":"Q = mcΔT","q":"2.0kgの水（比熱4200 J/(kg·K)）の温度を10K上昇させるのに必要な熱量を求めたい。どの公式を使うべきか？","opts":["Q = mcΔT","PV = nRT","P = IV","Q = ΔU + W"],"a":0,"ex":"質量・比熱・温度変化から熱量を求める。"},{"formula":"R = V/I","q":"回路に6.0Vの電圧をかけたところ2.0Aの電流が流れた。この抵抗の値を求めたい。どの公式を使うべきか？","opts":["P = IV","R = V/I","Q = ΔU + W","Q = mcΔT"],"a":1,"ex":"電圧と電流から抵抗を求めるオームの法則。"},{"formula":"P = IV","q":"電熱線に4.0Aの電流が流れ、両端に10Vの電圧がかかっている。消費電力を求めたい。どの公式を使うべきか？","opts":["R = V/I","Q = mcΔT","PV = nRT","P = IV"],"a":3,"ex":"電流と電圧から電力を求める。"},{"formula":"Q = ΔU + W","q":"気体に100Jの熱を加えたところ、気体が外部に30Jの仕事をした。気体の内部エネルギーの変化を求めたい。どの公式を使うべきか？","opts":["Q = ΔU + W","PV = nRT","P = IV","R = V/I"],"a":0,"ex":"熱力学第一法則からΔUを求める。"}]},"C":{"label":"C. 波動（Wave behaviour）","meaning":[{"formula":"v = fλ","q":"この公式の意味として正しいものは？","opts":["波の速さvが振動数fと波長λの積で表されるという波の基本式","2つの波が強め合う干渉条件を経路差で表す式","周期Tと振動数fが逆数の関係にあることを示す式","回折格子で明線が生じる条件を表す式"],"a":0,"ex":"波の基本式。"},{"formula":"T = 1/f","q":"この公式の意味として正しいものは？","opts":["回折格子で明線が生じる条件を表す式","波の速さが振動数と波長の積で表されるという式","周期Tと振動数fが逆数の関係にあることを示す式","音源が近づくときの音の振動数の変化を表す式"],"a":2,"ex":"周期と振動数の関係式。"},{"formula":"nλ = d sinθ","q":"この公式の意味として正しいものは？","opts":["周期Tと振動数fが逆数の関係にあることを示す式","2つの波が強め合う干渉条件を経路差で表す式","回折格子において、明線が生じる条件をスリット間隔d・波長λ・回折角θで表す式","波の速さが振動数と波長の積で表されるという式"],"a":2,"ex":"回折格子の式。"},{"formula":"f' = f(v/(v-u_s))","q":"この公式の意味として正しいものは？","opts":["波の速さが振動数と波長の積で表されるという式","回折格子で明線が生じる条件を表す式","音源が観測者に近づくときに聞こえる音の振動数の変化（ドップラー効果）を表す式","2つの波が強め合う干渉条件を経路差で表す式"],"a":2,"ex":"ドップラー効果（音源が近づく場合）の式。"},{"formula":"経路差 = nλ","q":"この公式の意味として正しいものは？","opts":["2つの波が強め合う（弱め合わない）干渉条件を、波長の整数倍の経路差で表す式","波の速さが振動数と波長の積で表されるという式","音源が近づくときの音の振動数の変化を表す式","周期と振動数が逆数の関係にあることを示す式"],"a":0,"ex":"建設的干渉（強め合い）の条件式。"}],"application":[{"formula":"v = fλ","q":"波長0.5mの波が振動数2.0Hzで伝わっている。この波の速さを求めたい。どの公式を使うべきか？","opts":["v = fλ","経路差 = nλ","nλ = d sinθ","T = 1/f"],"a":0,"ex":"振動数と波長から速さを求める波の基本式。"},{"formula":"T = 1/f","q":"ある波の振動数が50Hzであるとき、その周期を求めたい。どの公式を使うべきか？","opts":["経路差 = nλ","T = 1/f","f' = f(v/(v-u_s))","v = fλ"],"a":1,"ex":"振動数から周期を求める。"},{"formula":"nλ = d sinθ","q":"回折格子にレーザー光を当てたところ、特定の角度で明るい線（明線）が観測された。この明線の生じる条件を求めたい。どの公式を使うべきか？","opts":["v = fλ","f' = f(v/(v-u_s))","nλ = d sinθ","T = 1/f"],"a":2,"ex":"回折格子の明線条件。"},{"formula":"f' = f(v/(v-u_s))","q":"救急車が観測者に向かって近づいてくるとき、サイレンの音がどう変化して聞こえるかを求めたい。どの公式を使うべきか？","opts":["v = fλ","nλ = d sinθ","f' = f(v/(v-u_s))","経路差 = nλ"],"a":2,"ex":"ドップラー効果（音源接近）の式。"},{"formula":"経路差 = nλ","q":"2つのスピーカーから出た音が、ある地点で強め合っている。このときの2つの音源からの距離の差（経路差）の条件を求めたい。どの公式を使うべきか？","opts":["経路差 = nλ","f' = f(v/(v-u_s))","nλ = d sinθ","T = 1/f"],"a":0,"ex":"建設的干渉の経路差条件。"}]},"D":{"label":"D. 場（Fields）","meaning":[{"formula":"F = Gm₁m₂/r²","q":"この公式の意味として正しいものは？","opts":["2つの質量の間に働く万有引力の大きさを距離rを用いて ,"opts":["質量とエネルギーが等価であることを示すアインシュタインの式","運動量を持つ粒子が波としての性質を持つときの波長を表す式","放射性崩壊において残っている原子核の数を時間の関数として表す式","光子1個が持つエネルギーEを、プランク定数hと振動数fの積として表す式"],"a":3,"ex":"光子のエネルギーの式。"},{"formula":"E = mc²","q":"この公式の意味として正しいものは？","opts":["放射性崩壊において残っている原子核の数を時間の関数として表す式","光子1個が持つエネルギーをプランク定数と振動数の積として表す式","光電効果において放出される電子の最大運動エネルギーを表す式","質量mとエネルギーEが等価であることを示すアインシュタインの式"],"a":3,"ex":"質量とエネルギーの等価性。"},{"formula":"N = N₀e^(-λt)","q":"この公式の意味として正しいものは？","opts":["放射性崩壊において、時間tが経過した後に残っている原子核の数Nを、崩壊定数λを用いて表す式","光子1個が持つエネルギーをプランク定数と振動数の積として表す式","運動量を持つ粒子が波としての性質を持つときの波長を表す式","質量とエネルギーが等価であることを示すアインシュタインの式"],"a":0,"ex":"放射性崩壊の指数関数則。"},{"formula":"λ = h/p","q":"この公式の意味として正しいものは？","opts":["放射性崩壊において残っている原子核の数を表す式","光子1個が持つエネルギーをプランク定数と振動数の積として表す式","光電効果において放出される電子の最大運動エネルギーを表す式","運動量pを持つ粒子が波としての性質を持つときの波長（ド・ブロイ波長）を表す式"],"a":3,"ex":"ド・ブロイ波長の式。"},{"formula":"E_max = hf - Φ","q":"この公式の意味として正しいものは？","opts":["放射性崩壊において残っている原子核の数を表す式","運動量を持つ粒子が波としての性質を持つときの波長を表す式","質量とエネルギーが等価であることを示す式","光電効果において、放出される電子の最大運動エネルギーを、入射光の振動数fと仕事関数Φから求める式"],"a":3,"ex":"光電効果の式。"}],"application":[{"formula":"E = hf","q":"振動数5.0×10^14 Hzの光子1個のエネルギーを求めたい。どの公式を使うべきか？","opts":["E = hf","E = mc²","λ = h/p","N = N₀e^(-λt)"],"a":0,"ex":"振動数から光子エネルギーを求める。"},{"formula":"E = mc²","q":"核反応で失われた質量から、放出されるエネルギーの大きさを求めたい。どの公式を使うべきか？","opts":["λ = h/p","E = mc²","N = N₀e^(-λt)","E_max = hf - Φ"],"a":1,"ex":"質量欠損からエネルギーを求める。"},{"formula":"N = N₀e^(-λt)","q":"半減期の分かっているある放射性同位体について、一定時間後に残っている原子核の数を求めたい。どの公式を使うべきか？","opts":["λ = h/p","E = mc²","E = hf","N = N₀e^(-λt)"],"a":3,"ex":"放射性崩壊の式を使う。"},{"formula":"λ = h/p","q":"加速された電子が波としての性質を示すとき、その波長を求めたい。どの公式を使うべきか？","opts":["E = mc²","λ = h/p","N = N₀e^(-λt)","E_max = hf - Φ"],"a":1,"ex":"ド・ブロイ波長を求める。"},{"formula":"E_max = hf - Φ","q":"ある金属に光を当てたところ電子が飛び出した（光電効果）。飛び出した電子の最大運動エネルギーを求めたい。どの公式を使うべきか？","opts":["λ = h/p","E_max = hf - Φ","E = hf","N = N₀e^(-λt)"],"a":1,"ex":"光電効果の式を使う。"}]}};
const TYPE_META = {
  meaning:{label:"公式の意味", tag:"MEANING"},
  application:{label:"例題（どの公式？）", tag:"APPLICATION"}
};

let state = { chapter:"A", type:"meaning", idx:0, correctCount:0, answered:false, finished:false };

function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  ["A","B","C","D","E"].forEach(ch=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (ch===state.chapter?' active':'');
    chip.textContent = ch;
    chip.onclick = () => { state.chapter = ch; resetQuiz(); render(); };
    nav.appendChild(chip);
  });
}

function renderTypeTabs(){
  const wrap = document.getElementById('typeTabs');
  wrap.innerHTML = '';
  const bank = QUESTION_BANK[state.chapter];
  Object.keys(TYPE_META).forEach(t=>{
    const tab = document.createElement('div');
    tab.className = 'type-tab' + (t===state.type?' active':'');
    const n = bank[t].length;
    tab.innerHTML = TYPE_META[t].label + '<span class="count">'+n+' 問</span>';
    tab.onclick = () => { state.type = t; resetQuiz(); render(); };
    wrap.appendChild(tab);
  });
}

function resetQuiz(){ state.idx=0; state.correctCount=0; state.answered=false; state.finished=false; }
function currentQuestions(){ return QUESTION_BANK[state.chapter][state.type]; }

function renderProgress(){
  const qs = currentQuestions();
  const total = qs.length;
  const shown = Math.min(state.idx+1, total);
  document.getElementById('progressLabel').textContent = state.finished ? (total+' / '+total) : (shown+' / '+total);
  const pct = state.finished ? 100 : Math.round((state.idx/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const qs = currentQuestions();

  if(state.finished){
    const pct = Math.round((state.correctCount/qs.length)*100);
    area.innerHTML = `
      <div class="card result">
        <div class="score">${state.correctCount}<span> / ${qs.length}</span></div>
        <p>正答率 ${pct}% — ${TYPE_META[state.type].label} / ${QUESTION_BANK[state.chapter].label}</p>
        <button class="retry" onclick="resetQuiz();render();">もう一度解く</button>
      </div>`;
    renderProgress();
    return;
  }

  const q = qs[state.idx];
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(state.answered){
      cls += ' locked';
      if(i===q.a) cls += ' correct';
      else if(i===state.selected) cls += ' incorrect';
    }
    return `<button class="${cls}" onclick="selectOption(${i})"><span class="tag">${String.fromCharCode(65+i)}</span>${opt}</button>`;
  }).join('');

  const formulaBlock = state.type==='meaning' ? `<div class="formula-display">${q.formula}</div>` : '';

  area.innerHTML = `
    <div class="card">
      <div class="q-label">${TYPE_META[state.type].tag} — Q${state.idx+1}</div>
      <p class="q-text">${q.q}</p>
      ${formulaBlock}
      ${optsHtml}
      <div class="explain ${state.answered?'show':''}"><b>解説</b>${q.ex}</div>
      <div class="actions"><button class="next ${state.answered?'show':''}" onclick="nextQuestion()">${state.idx+1===qs.length?'結果を見る':'次の問題'}</button></div>
    </div>`;
  renderProgress();
}

function selectOption(i){
  if(state.answered) return;
  const q = currentQuestions()[state.idx];
  state.selected = i;
  state.answered = true;
  if(i===q.a) state.correctCount++;
  renderQuiz();
}

function nextQuestion(){
  const qs = currentQuestions();
  if(state.idx+1 >= qs.length){ state.finished = true; }
  else { state.idx++; state.answered=false; state.selected=null; }
  renderQuiz();
}

function render(){ renderChapterNav(); renderTypeTabs(); renderQuiz(); }
render();
</script>
